<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Circuit Build 8 — Three.js Fighter</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(8, 12, 20, 0.72);
      --line: rgba(255,255,255,0.18);
      --text: #f4f7fb;
      --muted: #a9b4c7;
      --p1: #34d6ff;
      --p2: #ff4b6e;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070c; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: var(--text); }
    .topbar {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      width: min(1100px, calc(100vw - 28px)); display: grid;
      grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: start;
    }
    .fighter-ui { min-width: 0; }
    .fighter-ui.right { text-align: right; }
    .name-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 800; letter-spacing: .16em; font-size: 12px; text-transform: uppercase; text-shadow: 0 2px 8px #000; }
    .right .name-row { flex-direction: row-reverse; }
    .health-shell {
      height: 24px; padding: 3px; border: 1px solid var(--line); background: rgba(0,0,0,.55);
      box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 12px rgba(255,255,255,.04);
      clip-path: polygon(0 0, 100% 0, 97% 100%, 3% 100%);
    }
    .health { height: 100%; width: 100%; transition: width 120ms linear; }
    #p1Health { background: linear-gradient(90deg, #117ee8, #34d6ff); }
    #p2Health { margin-left: auto; background: linear-gradient(90deg, #ff9b39, #ff4b6e); }
    .damage { height: 4px; margin-top: 4px; width: 100%; background: rgba(255,255,255,.12); overflow: hidden; }
    .damage > div { height: 100%; width: 0; transition: width 160ms ease; background: rgba(255,255,255,.65); }
    .timer {
      width: 76px; height: 58px; display: grid; place-items: center;
      background: var(--panel); border: 1px solid var(--line);
      font-size: 30px; font-weight: 900; letter-spacing: .02em;
      clip-path: polygon(14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%, 0 50%);
      text-shadow: 0 3px 12px #000;
    }
    #message {
      position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%) scale(.9);
      text-align: center; font-weight: 1000; letter-spacing: .14em; text-transform: uppercase;
      font-size: clamp(40px, 8vw, 96px); opacity: 0; transition: opacity 220ms, transform 220ms;
      text-shadow: 0 8px 28px #000, 0 0 18px rgba(255,255,255,.25);
    }
    #message.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #submessage { display: block; margin-top: 10px; font-size: 13px; letter-spacing: .2em; color: var(--muted); }
    #combo {
      position: absolute; top: 116px; left: 50%; transform: translateX(-50%) scale(.75);
      opacity: 0; text-align: center; transition: opacity 120ms, transform 160ms;
      font-weight: 1000; letter-spacing: .12em; text-transform: uppercase;
      text-shadow: 0 4px 18px #000, 0 0 14px rgba(255,210,80,.55);
    }
    #combo.show { opacity: 1; transform: translateX(-50%) scale(1); }
    #comboCount { font-size: 38px; line-height: .95; color: #fff0a2; }
    #comboLabel { display: block; margin-top: 4px; font-size: 11px; color: #fff; }
    .help {
      position: absolute; left: 18px; bottom: 18px; max-width: min(470px, calc(100vw - 36px));
      padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
      font-size: 12px; line-height: 1.65; color: var(--muted); backdrop-filter: blur(8px);
    }
    .help b { color: var(--text); }
    .ai {
      position: absolute; right: 18px; bottom: 18px; width: 250px; padding: 11px 13px;
      background: var(--panel); border: 1px solid var(--line); color: var(--muted);
      font-size: 11px; line-height: 1.55; backdrop-filter: blur(8px);
    }
    .ai b { color: var(--text); letter-spacing: .08em; }
    .ai span { color: #d8e2f2; }
    #flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events:none; mix-blend-mode: screen; }
    @media (max-width: 700px) {
      .topbar { gap: 8px; }
      .timer { width: 54px; height: 46px; font-size: 22px; }
      .name-row { font-size: 9px; letter-spacing: .08em; }
      .health-shell { height: 18px; }
      .ai { display: none; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="topbar">
      <div class="fighter-ui">
        <div class="name-row"><span>PLAYER</span><span>VOLT</span></div>
        <div class="health-shell"><div id="p1Health" class="health"></div></div>
        <div class="damage"><div id="p1Damage"></div></div>
      </div>
      <div id="timer" class="timer">60</div>
      <div class="fighter-ui right">
        <div class="name-row"><span>AI</span><span>ONYX</span></div>
        <div class="health-shell"><div id="p2Health" class="health"></div></div>
        <div class="damage"><div id="p2Damage"></div></div>
      </div>
    </div>
    <div id="message"><span id="messageText">FIGHT</span><span id="submessage"></span></div>
    <div id="combo"><span id="comboCount">2</span><span id="comboLabel">Hit Combo</span></div>
    <div class="help">
      <b>MOVE</b> WASD · double-tap any direction to dash · <b>JUMP</b> E, then J/K/L/I for aerial attacks &nbsp; <b>BASIC</b> J jab · K cross · L kick · I heavy kick &nbsp; <b>SPECIAL</b> Q uppercut · R backfist · F sweep · G flying knee &nbsp; <b>BLOCK</b> Space
    </div>
    <div class="ai">BUILD 8 · Opponent: adaptive AI</div>
  </div>
  <div id="flash"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  (() => {
    'use strict';
    console.info('IRON CIRCUIT BUILD 8 — special moves, aerial combat, and rapid attacks');

    const clamp = THREE.MathUtils.clamp;
    const lerp = THREE.MathUtils.lerp;
    const TAU = Math.PI * 2;
    const keys = Object.create(null);
    const tmpV = new THREE.Vector3();
    const tmpV2 = new THREE.Vector3();
    const clock = new THREE.Clock();
    // Places the bottom of the boots on the arena surface.
    const FIGHTER_GROUND_Y = .60;

    const ui = {
      p1Health: document.getElementById('p1Health'),
      p2Health: document.getElementById('p2Health'),
      p1Damage: document.getElementById('p1Damage'),
      p2Damage: document.getElementById('p2Damage'),
      timer: document.getElementById('timer'),
      message: document.getElementById('message'),
      messageText: document.getElementById('messageText'),
      submessage: document.getElementById('submessage'),
      combo: document.getElementById('combo'),
      comboCount: document.getElementById('comboCount'),
      flash: document.getElementById('flash')
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070c);
    scene.fog = new THREE.FogExp2(0x070a12, 0.035);

    const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8, 4.7, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x88aaff, 0x130d18, 1.35));

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.6);
    keyLight.position.set(5, 9, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -12;
    keyLight.shadow.camera.right = 12;
    keyLight.shadow.camera.top = 12;
    keyLight.shadow.camera.bottom = -12;
    scene.add(keyLight);

    const rim1 = new THREE.PointLight(0x00aaff, 45, 18, 2);
    rim1.position.set(-7, 4, -5);
    scene.add(rim1);
    const rim2 = new THREE.PointLight(0xff174f, 45, 18, 2);
    rim2.position.set(7, 4, 5);
    scene.add(rim2);

    function mat(color, metal = .18, rough = .48) {
      return new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough });
    }
    const darkMat = mat(0x111722, .5, .35);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x171c25, metalness: .25, roughness: .72 });
    const floor = new THREE.Mesh(new THREE.CylinderGeometry(7.4, 7.8, .35, 64), floorMat);
    floor.position.y = -.22;
    floor.receiveShadow = true;
    scene.add(floor);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(7.05, .055, 8, 128),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x5577ff, emissiveIntensity: 2.2 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = .015;
    scene.add(ring);

    const innerRing = new THREE.Mesh(
      new THREE.RingGeometry(2.2, 2.23, 96),
      new THREE.MeshBasicMaterial({ color: 0x4f668c, transparent: true, opacity: .34, side: THREE.DoubleSide })
    );
    innerRing.rotation.x = -Math.PI / 2;
    innerRing.position.y = .012;
    scene.add(innerRing);

    const grid = new THREE.GridHelper(14, 28, 0x313d58, 0x222938);
    grid.position.y = .018;
    grid.material.transparent = true;
    grid.material.opacity = .25;
    scene.add(grid);

    // Background pillars and lights.
    const pillarGeo = new THREE.BoxGeometry(.35, 5, .35);
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * TAU;
      const p = new THREE.Mesh(pillarGeo, darkMat);
      p.position.set(Math.cos(a) * 11.5, 2.25, Math.sin(a) * 11.5);
      p.rotation.y = -a;
      p.castShadow = p.receiveShadow = true;
      scene.add(p);
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(.04, 3.6, .08),
        new THREE.MeshBasicMaterial({ color: i % 2 ? 0xff2457 : 0x16c8ff })
      );
      strip.position.set(Math.cos(a) * 11.28, 2.55, Math.sin(a) * 11.28);
      strip.rotation.y = -a;
      scene.add(strip);
    }

    const POSE_KEYS = [
      'bodyX','bodyY','bodyZ','bodyRX','bodyRY','bodyRZ',
      'chestRX','chestRY','chestRZ','headRX','headRY','headRZ',
      'lShoulderX','lShoulderY','lShoulderZ','lElbowX','lElbowZ',
      'rShoulderX','rShoulderY','rShoulderZ','rElbowX','rElbowZ',
      'lHipX','lHipY','lHipZ','lKneeX','lAnkleX',
      'rHipX','rHipY','rHipZ','rKneeX','rAnkleX'
    ];

    function basePose() {
      const p = {};
      POSE_KEYS.forEach(k => p[k] = 0);
      p.bodyY = 0;
      p.lShoulderZ = -.14;
      p.rShoulderZ = .14;
      p.lElbowX = 1.18;
      p.rElbowX = 1.18;
      p.lShoulderX = .44;
      p.rShoulderX = .44;
      p.lShoulderY = -.10;
      p.rShoulderY = .10;
      p.lHipZ = -.04;
      p.rHipZ = .04;
      p.lKneeX = .07;
      p.rKneeX = .07;
      return p;
    }

    function mixPose(a, b, t) {
      const p = {};
      for (const k of POSE_KEYS) p[k] = lerp(a[k] || 0, b[k] || 0, t);
      return p;
    }

    function addPose(a, b, weight = 1) {
      const p = {};
      for (const k of POSE_KEYS) p[k] = (a[k] || 0) + (b[k] || 0) * weight;
      return p;
    }

    function smooth01(t) {
      t = clamp(t, 0, 1);
      return t * t * (3 - 2 * t);
    }
    function segment(t, a, b) { return smooth01((t - a) / (b - a)); }
    function pulse(t, a, peak, b) {
      if (t <= a || t >= b) return 0;
      return t < peak ? segment(t, a, peak) : 1 - segment(t, peak, b);
    }

    let hitStop = 0;
    let audioCtx = null;
    const DASH_WINDOW_MS = 245;
    const lastTap = Object.create(null);

    const ATTACKS = {
      // Ground attacks run at roughly one-third of the previous duration.
      jab:          { duration:.15, active:[.20,.43], cancel:.60, damage:7,  range:1.12, knock:.42, stun:.16, advance:.23, limb:'rFist', spark:0x9ae9ff },
      cross:        { duration:.21, active:[.27,.50], cancel:.62, damage:12, range:1.23, knock:.72, stun:.22, advance:.36, limb:'lFist', spark:0xffffff },
      kick:         { duration:.26, active:[.34,.60], cancel:.66, damage:15, range:1.39, knock:.90, stun:.28, advance:.20, limb:'rFoot', spark:0xffc35b },
      heavyKick:    { duration:.32, active:[.37,.63], cancel:.72, damage:22, range:1.68, knock:1.45, stun:.42, advance:.30, limb:'rFoot', spark:0xff5a70, knockdown:true },

      // Four typical fighting-game special moves.
      uppercut:     { duration:.29, active:[.28,.53], cancel:.78, damage:18, range:1.22, knock:1.18, stun:.38, advance:.20, limb:'rFist', spark:0x7ff5ff, knockdown:true, special:true, targetY:.32 },
      backfist:     { duration:.28, active:[.31,.58], cancel:.72, damage:16, range:1.34, knock:1.02, stun:.31, advance:.27, limb:'rFist', spark:0xe6b0ff, special:true },
      sweep:        { duration:.34, active:[.39,.66], cancel:.82, damage:14, range:1.52, knock:1.10, stun:.36, advance:.14, limb:'rFoot', spark:0xff9d54, knockdown:true, special:true, targetY:-.58 },
      flyingKnee:   { duration:.31, active:[.34,.61], cancel:.80, damage:20, range:1.48, knock:1.35, stun:.40, advance:.48, limb:'rKnee', spark:0xfff27a, knockdown:true, special:true, targetY:.12 },

      // Aerial attacks. They preserve the jump trajectory.
      jumpPunch:    { duration:.18, active:[.25,.58], damage:10, range:1.25, knock:.72, stun:.24, limb:'rFist', spark:0x93edff, aerial:true, targetY:.10 },
      jumpKick:     { duration:.24, active:[.28,.64], damage:17, range:1.52, knock:1.08, stun:.33, limb:'rFoot', spark:0xffd16f, aerial:true, knockdown:true, targetY:-.05 }
    };

    const COMBO_CHAINS = {
      jab:        ['jab','cross','kick','uppercut','backfist'],
      cross:      ['jab','kick','heavyKick','uppercut','backfist'],
      kick:       ['jab','cross','heavyKick','sweep','flyingKnee'],
      heavyKick:  [],
      uppercut:   [],
      backfist:   ['cross','kick','uppercut'],
      sweep:      [],
      flyingKnee: []
    };

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playImpactSound(strength=1, blocked=false) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = blocked ? 'square' : 'sawtooth';
      osc.frequency.setValueAtTime(blocked ? 190 : 105-strength*20, now);
      osc.frequency.exponentialRampToValueAtTime(blocked ? 85 : 42, now+.09);
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime((blocked?.035:.055)*strength,now+.006);
      gain.gain.exponentialRampToValueAtTime(.0001,now+.11);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now+.12);
    }

    function playWhoosh(pitch=170) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(pitch,now);
      osc.frequency.exponentialRampToValueAtTime(pitch*.45,now+.13);
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(.025,now+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,now+.14);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now+.15);
    }

    class Fighter {
      constructor(name, color, accent, x, isAI = false) {
        this.name = name;
        this.isAI = isAI;
        this.health = 100;
        this.displayHealth = 100;
        this.state = 'idle';
        this.stateTime = 0;
        this.stateDuration = 0;
        this.attackName = null;
        this.attackHit = false;
        this.hitStrength = 0;
        this.velocity = new THREE.Vector3();
        this.move = new THREE.Vector3();
        this.walkPhase = 0;
        this.motionForward = 0;
        this.motionStrafe = 0;
        this.speedRatio = 0;
        this.attackTravel = 0;
        this.comboQueue = null;
        this.comboHits = 0;
        this.comboClock = 0;
        this.dashKind = null;
        this.jumpForward = 0;
        this.jumpStrafe = 0;
        this.jumpClock = 0;
        this.jumpDuration = .72;
        this.airAttackUsed = false;
        this.trailTimer = 0;
        this.dashTrailTimer = 0;
        this.aiThink = 0;
        this.aiStrafe = 0;
        this.blocking = false;
        this.wasBlocking = false;
        this.flashTime = 0;
        this.scale = 1;
        this.radius = .56;
        this.root = new THREE.Group();
        this.root.position.set(x, FIGHTER_GROUND_Y, 0);
        scene.add(this.root);

        this.visual = new THREE.Group();
        this.root.add(this.visual);

        this.materials = {
          main: mat(color, .34, .38),
          accent: new THREE.MeshStandardMaterial({ color: accent, emissive: accent, emissiveIntensity: .15, metalness: .5, roughness: .25 }),
          skin: mat(0xd9a783, .05, .62),
          dark: mat(0x0e1219, .45, .38),
          sole: mat(0x05070b, .4, .34)
        };

        const mesh = (geo, material, parent, pos = [0,0,0]) => {
          const m = new THREE.Mesh(geo, material);
          m.position.set(...pos);
          m.castShadow = true;
          m.receiveShadow = true;
          parent.add(m);
          return m;
        };

        this.body = new THREE.Group();
        this.visual.add(this.body);

        this.hips = new THREE.Group();
        this.hips.position.y = 1.18;
        this.body.add(this.hips);

        const pelvis = mesh(new THREE.CapsuleGeometry(.31,.24,7,14), this.materials.dark, this.hips, [0,-.01,0]);
        pelvis.scale.set(1.18,.80,.82);
        mesh(new THREE.BoxGeometry(.78,.12,.44), this.materials.accent, this.hips, [0,.13,-.01]);
        mesh(new THREE.BoxGeometry(.16,.17,.48), this.materials.dark, this.hips, [0,.02,-.03]);

        this.chest = new THREE.Group();
        this.chest.position.y = .22;
        this.hips.add(this.chest);

        const abdomen = mesh(new THREE.CapsuleGeometry(.29,.38,7,14), this.materials.dark, this.chest, [0,.20,0]);
        abdomen.scale.set(.96,1,.78);
        const torso = mesh(new THREE.CapsuleGeometry(.42,.70,8,16), this.materials.main, this.chest, [0,.52,0]);
        torso.scale.set(1.08,1,.74);
        const chestPlate = mesh(new THREE.BoxGeometry(.80,.24,.13), this.materials.accent, this.chest, [0,.58,-.36]);
        chestPlate.rotation.x = -.04;
        mesh(new THREE.BoxGeometry(.50,.055,.16), this.materials.dark, this.chest, [0,.42,-.39]);
        mesh(new THREE.BoxGeometry(.14,.54,.12), this.materials.dark, this.chest, [0,.59,-.39]);

        this.neck = new THREE.Group();
        this.neck.position.set(0,1.0,0);
        this.chest.add(this.neck);
        mesh(new THREE.CylinderGeometry(.12,.14,.18,12), this.materials.skin, this.neck, [0,.03,0]);

        this.head = new THREE.Group();
        this.head.position.y = .17;
        this.neck.add(this.head);

        const skull = mesh(new THREE.SphereGeometry(.29,24,18), this.materials.skin, this.head, [0,.22,0]);
        skull.scale.set(.88,1.08,.91);
        const jaw = mesh(new THREE.CapsuleGeometry(.20,.13,6,12), this.materials.skin, this.head, [0,.06,-.015]);
        jaw.scale.set(1.05,.72,.86);
        mesh(new THREE.BoxGeometry(.38,.13,.31), this.materials.dark, this.head, [0,.29,-.17]);
        mesh(new THREE.BoxGeometry(.20,.08,.08), this.materials.skin, this.head, [0,.17,-.285]);
        mesh(new THREE.SphereGeometry(.052,12,8), this.materials.skin, this.head, [-.265,.21,0]);
        mesh(new THREE.SphereGeometry(.052,12,8), this.materials.skin, this.head, [.265,.21,0]);
        const eyeMat = new THREE.MeshBasicMaterial({ color: accent });
        mesh(new THREE.BoxGeometry(.27,.038,.018), eyeMat, this.head, [0,.27,-.337]);
        mesh(new THREE.BoxGeometry(.31,.035,.035), this.materials.dark, this.head, [0,.34,-.285]);

        this.joints = {};
        const makeArm = (side) => {
          const s = side === 'l' ? -1 : 1;
          const shoulder = new THREE.Group();
          shoulder.position.set(s*.53,.78,0);
          this.chest.add(shoulder);

          const shoulderCap = mesh(new THREE.SphereGeometry(.18,16,12), this.materials.accent, shoulder);
          shoulderCap.scale.set(1.08,.95,1.02);
          const upperArm = mesh(new THREE.CapsuleGeometry(.135,.48,7,12), this.materials.main, shoulder, [0,-.35,0]);
          upperArm.scale.set(.96,1,.93);
          mesh(new THREE.CylinderGeometry(.155,.145,.12,14), this.materials.dark, shoulder, [0,-.57,0]);

          const elbow = new THREE.Group();
          elbow.position.set(0,-.66,0);
          shoulder.add(elbow);
          const elbowCap = mesh(new THREE.SphereGeometry(.14,14,10), this.materials.dark, elbow);
          elbowCap.scale.set(1.02,.92,1.02);

          const forearm = mesh(new THREE.CapsuleGeometry(.11,.42,7,12), this.materials.skin, elbow, [0,-.30,0]);
          forearm.scale.set(1.02,1,.96);
          mesh(new THREE.CylinderGeometry(.135,.12,.18,14), this.materials.accent, elbow, [0,-.56,0]);

          const fist = mesh(new THREE.BoxGeometry(.27,.25,.31), this.materials.accent, elbow, [0,-.68,-.035]);
          fist.scale.set(1.02,.92,1.03);
          mesh(new THREE.BoxGeometry(.22,.06,.325), this.materials.dark, fist, [0,-.105,-.01]);

          this.joints[side+'Shoulder'] = shoulder;
          this.joints[side+'Elbow'] = elbow;
          this.joints[side+'Fist'] = fist;
        };
        makeArm('l'); makeArm('r');

        const makeLeg = (side) => {
          const s = side === 'l' ? -1 : 1;
          const hip = new THREE.Group();
          hip.position.set(s*.27,-.04,0);
          this.hips.add(hip);

          const hipCap = mesh(new THREE.SphereGeometry(.185,14,10), this.materials.dark, hip);
          hipCap.scale.set(1.02,.96,1.02);
          const thigh = mesh(new THREE.CapsuleGeometry(.17,.55,7,12), this.materials.main, hip, [0,-.42,0]);
          thigh.scale.set(1.02,1,.96);
          mesh(new THREE.BoxGeometry(.31,.16,.32), this.materials.dark, hip, [0,-.69,0]);

          const knee = new THREE.Group();
          knee.position.set(0,-.82,0);
          hip.add(knee);
          const kneeCap = mesh(new THREE.SphereGeometry(.158,14,10), this.materials.accent, knee);
          kneeCap.scale.set(1.04,.92,1.04);
          const calf = mesh(new THREE.CapsuleGeometry(.135,.51,7,12), this.materials.dark, knee, [0,-.38,0]);
          calf.scale.set(.98,1,.93);

          const ankle = new THREE.Group();
          ankle.position.set(0,-.77,0);
          knee.add(ankle);
          mesh(new THREE.CylinderGeometry(.125,.14,.16,14), this.materials.accent, ankle, [0,.01,0]);
          const foot = mesh(new THREE.BoxGeometry(.33,.22,.58), this.materials.sole, ankle, [0,-.08,-.17]);
          mesh(new THREE.BoxGeometry(.29,.055,.40), this.materials.accent, foot, [0,.105,-.05]);
          this.joints[side+'Hip'] = hip;
          this.joints[side+'Knee'] = knee;
          this.joints[side+'Ankle'] = ankle;
          this.joints[side+'Foot'] = foot;
        };
        makeLeg('l'); makeLeg('r');

        this.currentPose = basePose();
        this.targetPose = basePose();
      }

      canAct() {
        return !roundOver && !['hit','down','getup','win'].includes(this.state);
      }

      requestAttack(name) {
        if (this.state === 'jump' || this.state === 'jumpAttack') {
          return this.startAirAttack(name);
        }
        if (this.state === 'attack' && this.attackName) {
          const n = this.stateTime / Math.max(this.stateDuration,.001);
          const allowed = COMBO_CHAINS[this.attackName] || [];
          if (n >= .18 && n <= .94 && allowed.includes(name)) {
            this.comboQueue = name;
            return true;
          }
          return false;
        }
        return this.startAttack(name);
      }

      startAttack(name, chained=false) {
        if (!ATTACKS[name] || ATTACKS[name].aerial) return false;
        if (!chained && (!this.canAct() || !['idle','walk','block'].includes(this.state))) return false;
        this.state = 'attack';
        this.stateTime = 0;
        this.attackName = name;
        this.stateDuration = ATTACKS[name].duration;
        this.attackHit = false;
        this.attackTravel = 0;
        this.comboQueue = null;
        this.trailTimer = 0;
        this.blocking = false;
        const pitch =
          name === 'uppercut' ? 235 :
          name === 'backfist' ? 150 :
          name === 'sweep' ? 110 :
          name === 'flyingKnee' ? 125 :
          name === 'heavyKick' ? 105 :
          name === 'kick' ? 130 : 205;
        playWhoosh(pitch);
        return true;
      }

      startAirAttack(inputName) {
        if (this.state !== 'jump' || this.airAttackUsed) return false;
        const kickInputs = ['kick','heavyKick','sweep','flyingKnee'];
        const name = kickInputs.includes(inputName) ? 'jumpKick' : 'jumpPunch';
        this.state = 'jumpAttack';
        this.stateTime = 0;
        this.stateDuration = ATTACKS[name].duration;
        this.attackName = name;
        this.attackHit = false;
        this.airAttackUsed = true;
        this.trailTimer = 0;
        playWhoosh(name === 'jumpKick' ? 145 : 220);
        return true;
      }

      startDash(kind) {
        if (roundOver || !['idle','walk','block'].includes(this.state)) return false;
        this.state = 'dash';
        this.stateTime = 0;
        this.stateDuration = kind === 'back' ? .22 : (kind === 'left' || kind === 'right') ? .18 : .19;
        this.dashKind = kind;
        this.blocking = false;
        this.velocity.set(0,0,0);
        this.dashTrailTimer = 0;
        const dustPos = this.root.position.clone();
        dustPos.y = .12;
        sparks.spawn(dustPos, 0xb8d4ff, 13, 1.05);
        cameraRig.shake = Math.max(cameraRig.shake,.035);
        playWhoosh(kind === 'back' ? 120 : 155);
        return true;
      }

      startJump() {
        if (roundOver || !['idle','walk','block'].includes(this.state)) return false;
        this.state = 'jump';
        this.stateTime = 0;
        this.stateDuration = this.jumpDuration;
        this.jumpClock = 0;
        this.airAttackUsed = false;
        this.jumpForward = clamp(this.move.z,-1,1);
        this.jumpStrafe = clamp(this.move.x,-1,1);
        this.blocking = false;
        this.velocity.set(0,0,0);
        const dustPos = this.root.position.clone();
        dustPos.y = .10;
        sparks.spawn(dustPos, 0xc9ddff, 10, .72);
        playWhoosh(215);
        return true;
      }

      registerHit(blocked) {
        if (blocked) return;
        this.comboHits = this.comboClock > 0 ? this.comboHits + 1 : 1;
        this.comboClock = 1.08;
        if (!this.isAI && this.comboHits >= 2) showCombo(this.comboHits);
      }

      takeHit(attack, attacker) {
        if (roundOver || this.state === 'down' || this.state === 'getup') return;
        if (this.state === 'jump' || this.state === 'jumpAttack') this.root.position.y = FIGHTER_GROUND_Y;
        this.comboQueue = null;
        this.comboHits = 0;
        this.comboClock = 0;
        const toAttacker = tmpV.copy(attacker.root.position).sub(this.root.position).normalize();
        const forward = new THREE.Vector3(0,0,-1).applyQuaternion(this.root.quaternion);
        const facingAttack = forward.dot(toAttacker) > .15;
        const blocked = this.blocking && facingAttack;

        let damage = attack.damage;
        let knock = attack.knock;
        let stun = attack.stun;
        const impactDir = this.root.position.clone().sub(attacker.root.position).setY(.10).normalize();
        if (blocked) {
          damage *= .18;
          knock *= .32;
          stun *= .5;
          impactFX.spawn(attack.limbPos,0x72d7ff,.55,impactDir,true);
        } else {
          const strength = attack.knockdown ? 1.55 : attack.damage >= 12 ? 1.05 : .78;
          impactFX.spawn(attack.limbPos,attack.spark,strength,impactDir,false);
          cameraRig.shake = Math.max(cameraRig.shake, attack.knockdown ? .34 : attack.damage >= 12 ? .18 : .11);
          cameraRig.fovKick = Math.max(cameraRig.fovKick,attack.knockdown ? 5.0 : attack.damage >= 12 ? 3.0 : 1.8);
          screenFlash(attack.knockdown ? .22 : attack.damage >= 12 ? .11 : .065);
        }

        this.health = Math.max(0, this.health - damage);
        this.velocity.addScaledVector(toAttacker.clone().negate(), knock);
        this.hitStrength = knock;
        this.state = this.health <= 0 || (!blocked && attack.knockdown) ? 'down' : 'hit';
        this.stateTime = 0;
        this.stateDuration = this.state === 'down' ? 2.2 : stun;
        this.attackName = null;
        this.blocking = false;
        this.flashTime = blocked ? .06 : .13;
        attacker.registerHit(blocked);
        playImpactSound(attack.knockdown ? 1.45 : attack.damage >= 12 ? 1.10 : .85,blocked);
        hitStop = Math.max(hitStop, blocked ? .030 : (attack.knockdown ? .095 : attack.damage >= 12 ? .062 : .045));
        updateHealthUI();

        if (this.health <= 0) endRound(attacker);
      }

      attackPose(name, t) {
        const p = basePose();

        if (name === 'jab') {
          const load = pulse(t,.00,.12,.29);
          const extend = pulse(t,.12,.34,.57);
          const settle = segment(t,.56,.96);

          p.bodyY = -.025*load + .018*extend;
          p.bodyZ = -.17*extend + .025*settle;
          p.bodyRX = -.035*extend;
          p.bodyRY = -.14*extend + .045*settle;
          p.bodyRZ = -.025*extend;
          p.chestRY = -.22*extend;
          p.headRY = .08*extend;

          p.rShoulderX = lerp(.52,1.72,extend);
          p.rShoulderY = .05;
          p.rShoulderZ = .03;
          p.rElbowX = lerp(1.28,.015,extend);
          p.lShoulderX = .78 + .08*load;
          p.lShoulderY = -.17;
          p.lShoulderZ = -.16;
          p.lElbowX = 1.52;

          p.rHipX = .08*load;
          p.lHipX = -.08*extend;
          p.rKneeX = .14*load;
          p.lKneeX = .10 + .05*extend;
          p.rAnkleX = .07*load;
        } else if (name === 'cross') {
          const coil = pulse(t,.00,.17,.37);
          const drive = pulse(t,.18,.45,.68);
          const settle = segment(t,.67,.98);

          p.bodyY = -.035*coil + .025*drive;
          p.bodyZ = -.24*drive + .035*settle;
          p.bodyRX = -.055*drive;
          p.bodyRY = -.16*coil + .48*drive - .08*settle;
          p.bodyRZ = -.055*drive;
          p.chestRY = -.22*coil + .62*drive;
          p.headRY = -.13*drive;

          p.lShoulderX = lerp(.56,1.78,drive);
          p.lShoulderY = -.10;
          p.lShoulderZ = -.04;
          p.lElbowX = lerp(1.30,.018,drive);
          p.rShoulderX = .80;
          p.rShoulderY = .18;
          p.rShoulderZ = .18;
          p.rElbowX = 1.58;

          p.rHipY = -.20*drive;
          p.lHipY = .24*drive;
          p.rHipX = -.10*drive;
          p.lHipX = .10*coil;
          p.rKneeX = .18*drive;
          p.lKneeX = .10;
          p.rAnkleX = .07*drive;
        } else if (name === 'kick') {
          const load = pulse(t,.00,.17,.40);
          const chamber = pulse(t,.10,.31,.72);
          const extend = pulse(t,.28,.51,.72);
          const folded = chamber*(1-extend);

          p.bodyY = .08*chamber;
          p.bodyZ = -.10*extend;
          p.bodyRX = .08*extend;
          p.bodyRY = -.34*extend;
          p.bodyRZ = .15*extend;
          p.chestRY = -.28*extend;
          p.chestRZ = .08*extend;
          p.headRY = .10*extend;

          p.rHipX = .72*folded + 1.48*extend;
          p.rHipY = -.18*extend;
          p.rHipZ = -.13*extend;
          p.rKneeX = -1.34*folded + .04*extend;
          p.rAnkleX = -.22*extend;

          p.lHipX = -.10*extend;
          p.lKneeX = .25*chamber;
          p.lAnkleX = .09*extend;

          p.lShoulderX = .88;
          p.lShoulderY = -.16;
          p.lShoulderZ = -.26;
          p.lElbowX = 1.50;
          p.rShoulderX = .24;
          p.rShoulderY = .12;
          p.rShoulderZ = .24;
          p.rElbowX = 1.42;
        } else if (name === 'heavyKick') {
          const load = pulse(t,.00,.14,.34);
          const chamber = pulse(t,.05,.26,.82);
          const extension = pulse(t,.22,.50,.73);
          const recovery = segment(t,.70,.98);
          const folded = chamber*(1-extension);

          p.bodyY = .10*chamber - .025*load;
          p.bodyZ = -.27*extension + .05*recovery;
          p.bodyRX = -.15*extension + .035*load;
          p.bodyRY = -.035*load;
          p.bodyRZ = 0;
          p.chestRX = -.10*extension;
          p.chestRY = .06*load;
          p.headRX = .06*extension;

          p.rHipX = .84*folded + 1.58*extension;
          p.rHipY = 0;
          p.rHipZ = 0;
          p.rKneeX = -1.46*folded + .015*extension;
          p.rAnkleX = -.24*extension;

          p.lHipX = -.13*extension;
          p.lHipY = 0;
          p.lHipZ = 0;
          p.lKneeX = .30*chamber;
          p.lAnkleX = .09*extension;

          p.lShoulderX = .78 + .10*load;
          p.rShoulderX = .46;
          p.lShoulderY = -.13;
          p.rShoulderY = .13;
          p.lShoulderZ = -.16;
          p.rShoulderZ = .16;
          p.lElbowX = 1.55;
          p.rElbowX = 1.40;
        } else if (name === 'uppercut') {
          const load = pulse(t,0,.16,.34);
          const rise = pulse(t,.16,.43,.70);
          const settle = segment(t,.68,1);

          p.bodyY = -.15*load + .18*rise;
          p.bodyZ = -.18*rise + .04*settle;
          p.bodyRX = -.18*rise;
          p.bodyRY = -.18*load + .30*rise;
          p.bodyRZ = -.08*rise;
          p.chestRX = -.22*rise;
          p.chestRY = .38*rise;
          p.headRX = -.12*rise;

          p.rShoulderX = .42 + 1.82*rise;
          p.rShoulderY = .10;
          p.rShoulderZ = .08;
          p.rElbowX = 1.48*(1-rise) + .06*rise;
          p.lShoulderX = .82;
          p.lShoulderY = -.18;
          p.lShoulderZ = -.20;
          p.lElbowX = 1.58;

          p.rHipX = -.16*rise;
          p.lHipX = .24*load;
          p.rKneeX = .20 + .18*rise;
          p.lKneeX = .30*load;
          p.rAnkleX = .10*rise;
        } else if (name === 'backfist') {
          const coil = pulse(t,0,.19,.38);
          const spin = pulse(t,.17,.48,.72);
          const recoil = segment(t,.70,1);

          p.bodyZ = -.15*spin + .03*recoil;
          p.bodyRY = -.54*coil + 1.02*spin;
          p.bodyRZ = -.08*spin;
          p.chestRY = -.70*coil + 1.26*spin;
          p.headRY = -.25*spin;

          p.rShoulderX = .84 + .56*spin;
          p.rShoulderY = -.42*coil + .72*spin;
          p.rShoulderZ = .20;
          p.rElbowX = 1.14 - .92*spin;
          p.lShoulderX = .72;
          p.lShoulderY = -.18;
          p.lElbowX = 1.54;

          p.rHipY = -.30*coil + .35*spin;
          p.lHipY = .26*coil - .30*spin;
          p.rKneeX = .16*spin;
          p.lKneeX = .12;
        } else if (name === 'sweep') {
          const drop = pulse(t,0,.23,.76);
          const arc = pulse(t,.18,.50,.77);
          const recover = segment(t,.74,1);

          p.bodyY = -.38*drop + .05*recover;
          p.bodyZ = .08*drop;
          p.bodyRX = .24*drop;
          p.bodyRY = -.82*arc;
          p.bodyRZ = .20*drop;
          p.chestRY = -.94*arc;
          p.chestRZ = .14*drop;
          p.headRY = .24*arc;

          p.rHipX = 1.05*arc;
          p.rHipY = -.72*arc;
          p.rHipZ = -.52*arc;
          p.rKneeX = .10*arc;
          p.rAnkleX = -.18*arc;

          p.lHipX = -.34*drop;
          p.lKneeX = .82*drop;
          p.lAnkleX = .16*drop;

          p.lShoulderX = .28;
          p.rShoulderX = .34;
          p.lShoulderZ = -.72*drop;
          p.rShoulderZ = .60*drop;
          p.lElbowX = 1.22;
          p.rElbowX = 1.18;
        } else if (name === 'flyingKnee') {
          const crouch = pulse(t,0,.15,.31);
          const drive = pulse(t,.13,.47,.76);
          const recoil = segment(t,.73,1);

          p.bodyY = -.13*crouch + .24*drive;
          p.bodyZ = -.34*drive + .05*recoil;
          p.bodyRX = -.22*drive;
          p.bodyRY = -.05*drive;
          p.chestRX = -.12*drive;
          p.headRX = .08*drive;

          p.rHipX = .98*drive;
          p.rKneeX = -1.44*drive;
          p.rAnkleX = -.12*drive;
          p.lHipX = -.30*drive;
          p.lKneeX = .58*drive;
          p.lAnkleX = .12*drive;

          p.lShoulderX = .96;
          p.rShoulderX = .76;
          p.lShoulderZ = -.24;
          p.rShoulderZ = .24;
          p.lElbowX = 1.58;
          p.rElbowX = 1.52;
        }
        return p;
      }

      idlePose(time) {
        const p = basePose();
        const breath = Math.sin(time*2.15);
        const weight = Math.sin(time*.78);
        const guard = Math.sin(time*1.52+.7);
        const micro = Math.sin(time*3.8);

        p.bodyX = .022*weight;
        p.bodyY = .018*breath - .008;
        p.bodyZ = .010*guard;
        p.bodyRX = -.018 + .012*breath;
        p.bodyRY = .025*weight;
        p.bodyRZ = -.024*weight;

        p.chestRX = .025*breath;
        p.chestRY = -.045*weight;
        p.chestRZ = .018*weight;
        p.headRX = -.012*breath;
        p.headRY = .024*weight;
        p.headRZ = .010*weight;

        p.lShoulderX = .57 + .035*guard;
        p.rShoulderX = .54 - .035*guard;
        p.lShoulderY = -.12;
        p.rShoulderY = .12;
        p.lShoulderZ = -.11 - .015*weight;
        p.rShoulderZ = .11 - .015*weight;
        p.lElbowX = 1.34 + .035*micro;
        p.rElbowX = 1.31 - .035*micro;

        p.lHipX = -.025*weight;
        p.rHipX = .025*weight;
        p.lHipZ = -.018*weight;
        p.rHipZ = -.018*weight;
        p.lKneeX = .10 + .035*Math.max(0,weight);
        p.rKneeX = .10 + .035*Math.max(0,-weight);
        p.lAnkleX = .018*weight;
        p.rAnkleX = -.018*weight;
        return p;
      }

      runPose(forward, strafe, speed) {
        const p = basePose();
        const amp = clamp(speed,0,1);
        const travelSign = Math.abs(forward) > .08 ? Math.sign(forward) : 1;
        const phase = this.walkPhase;
        const left = Math.sin(phase) * travelSign;
        const right = -left;
        const leftLift = Math.max(0, Math.sin(phase + Math.PI*.45));
        const rightLift = Math.max(0, Math.sin(phase + Math.PI*1.45));
        const contact = Math.abs(Math.sin(phase));
        const lateralStep = Math.sin(phase) * strafe;

        p.bodyY = -.045*contact*amp;
        p.bodyX = .028*lateralStep*amp;
        p.bodyZ = -.035*Math.max(0,forward)*amp + .018*Math.max(0,-forward)*amp;
        p.bodyRX = -.14*forward*amp;
        p.bodyRY = -.035*left*amp;
        p.bodyRZ = -.09*strafe*amp + .025*left*amp;

        p.chestRX = .045*forward*amp;
        p.chestRY = .11*left*amp;
        p.chestRZ = .045*strafe*amp;
        p.headRX = .03*forward*amp;
        p.headRY = -.065*left*amp;
        p.headRZ = .025*strafe*amp;

        const stride = .76*amp*(.45+.55*Math.abs(forward));
        p.lHipX = left*stride + .10*leftLift*amp;
        p.rHipX = right*stride + .10*rightLift*amp;
        p.lKneeX = .08 + Math.max(0,-left)*.78*amp + leftLift*.18*amp;
        p.rKneeX = .08 + Math.max(0,-right)*.78*amp + rightLift*.18*amp;
        p.lAnkleX = -.16*Math.max(0,left)*amp + .12*Math.max(0,-left)*amp;
        p.rAnkleX = -.16*Math.max(0,right)*amp + .12*Math.max(0,-right)*amp;

        p.lHipZ = -.25*lateralStep*amp;
        p.rHipZ = .25*lateralStep*amp;
        p.lKneeX += Math.max(0,strafe*lateralStep)*.12*amp;
        p.rKneeX += Math.max(0,-strafe*lateralStep)*.12*amp;

        // Arms remain in a fighting guard while pumping against the legs.
        p.lShoulderX = .68 + right*.18*amp;
        p.rShoulderX = .65 + left*.18*amp;
        p.lShoulderY = -.14 - left*.035*amp;
        p.rShoulderY = .14 - right*.035*amp;
        p.lShoulderZ = -.15 - strafe*.06;
        p.rShoulderZ = .15 - strafe*.06;
        p.lElbowX = 1.43 - right*.10*amp;
        p.rElbowX = 1.40 - left*.10*amp;
        return p;
      }

      airAttackPose(name, t, jumpT) {
        const p = this.jumpPose(jumpT);

        if (name === 'jumpPunch') {
          const strike = pulse(t,.08,.42,.75);
          p.bodyRX -= .12*strike;
          p.bodyRY -= .20*strike;
          p.chestRY -= .34*strike;
          p.rShoulderX = lerp(.72,1.74,strike);
          p.rShoulderY = .06;
          p.rShoulderZ = .03;
          p.rElbowX = lerp(1.40,.02,strike);
          p.lShoulderX = .88;
          p.lElbowX = 1.55;
          p.lHipX += .16*strike;
          p.rKneeX += .15*strike;
        } else {
          const chamber = pulse(t,.02,.25,.72);
          const extend = pulse(t,.20,.48,.78);
          const folded = chamber*(1-extend);

          p.bodyRX += .20*extend;
          p.bodyRY -= .18*extend;
          p.bodyRZ += .10*extend;
          p.chestRY -= .18*extend;

          p.rHipX = .70*folded + 1.60*extend;
          p.rHipY = -.14*extend;
          p.rHipZ = -.10*extend;
          p.rKneeX = -1.35*folded + .02*extend;
          p.rAnkleX = -.24*extend;

          p.lHipX = .18*chamber;
          p.lKneeX = .70*chamber;
          p.lShoulderX = .90;
          p.rShoulderX = .30;
          p.lElbowX = 1.55;
          p.rElbowX = 1.42;
        }
        return p;
      }

      dashPose(kind, t) {
        const p = basePose();
        const burst = Math.sin(Math.PI*clamp(t,0,1));
        const forward = kind === 'forward' ? 1 : kind === 'back' ? -1 : 0;
        const side = kind === 'right' ? 1 : kind === 'left' ? -1 : 0;

        p.bodyY = -.10*burst;
        p.bodyZ = -.20*forward*burst;
        p.bodyRX = -.30*forward*burst;
        p.bodyRZ = -.26*side*burst;
        p.chestRX = .10*forward*burst;
        p.chestRY = -.08*side*burst;
        p.headRX = .09*forward*burst;
        p.headRZ = .10*side*burst;

        p.lHipX = .44*forward*burst + .18*side*burst;
        p.rHipX = -.34*forward*burst - .18*side*burst;
        p.lHipZ = -.42*side*burst;
        p.rHipZ = .42*side*burst;
        p.lKneeX = .30 + .30*Math.max(0,forward)*burst;
        p.rKneeX = .25 + .34*Math.max(0,-forward)*burst;
        p.lAnkleX = .12*forward*burst;
        p.rAnkleX = -.10*forward*burst;

        p.lShoulderX = .86;
        p.rShoulderX = .82;
        p.lShoulderY = -.18;
        p.rShoulderY = .18;
        p.lShoulderZ = -.20 - .16*side*burst;
        p.rShoulderZ = .20 - .16*side*burst;
        p.lElbowX = 1.56;
        p.rElbowX = 1.53;
        return p;
      }

      jumpPose(t) {
        const p = basePose();
        const takeoff = pulse(t,0,.12,.29);
        const air = Math.sin(Math.PI*clamp(t,0,1));
        const landing = segment(t,.78,1);

        p.bodyY = -.11*takeoff - .07*landing;
        p.bodyRX = -.12*this.jumpForward*air;
        p.bodyRZ = -.10*this.jumpStrafe*air;
        p.chestRX = .06*this.jumpForward*air;
        p.headRX = .04*this.jumpForward*air;

        p.lHipX = .38*air + .18*this.jumpForward*air;
        p.rHipX = .62*air + .18*this.jumpForward*air;
        p.lKneeX = .72*air + .20*landing;
        p.rKneeX = .92*air + .20*landing;
        p.lAnkleX = -.14*air;
        p.rAnkleX = -.18*air;

        p.lShoulderX = .72 - .20*air;
        p.rShoulderX = .70 - .16*air;
        p.lShoulderZ = -.24;
        p.rShoulderZ = .24;
        p.lElbowX = 1.42;
        p.rElbowX = 1.40;
        return p;
      }

      blockPose(time) {
        const p = basePose();
        p.bodyZ = .05;
        p.bodyRX = -.06;
        p.chestRX = -.10;
        p.lShoulderX = 1.15;
        p.rShoulderX = 1.15;
        p.lShoulderY = -.22;
        p.rShoulderY = .22;
        p.lShoulderZ = -.32;
        p.rShoulderZ = .32;
        p.lElbowX = 1.55;
        p.rElbowX = 1.55;
        p.lHipX = -.10;
        p.rHipX = .08;
        p.lKneeX = .19;
        p.rKneeX = .19;
        p.bodyY = -.04 + Math.sin(time*5)*.008;
        return p;
      }

      hitPose(t) {
        const p = basePose();
        const hit = pulse(t,0,.18,.95);
        const dir = this.hitStrength > .8 ? 1 : .65;
        p.bodyZ = .12*hit*dir;
        p.bodyRX = -.18*hit*dir;
        p.bodyRY = .20*hit;
        p.chestRX = -.32*hit*dir;
        p.chestRY = .25*hit;
        p.headRX = -.24*hit;
        p.headRY = -.20*hit;
        p.lShoulderX = .05 + .2*(1-hit);
        p.rShoulderX = .12 + .2*(1-hit);
        p.lElbowX = .65;
        p.rElbowX = .65;
        p.lHipX = -.10*hit;
        p.rHipX = .18*hit;
        return p;
      }

      downPose(t) {
        const p = basePose();
        const fall = segment(t,0,.42);
        const settle = segment(t,.42,.72);
        p.bodyY = -.78*fall;
        p.bodyRX = -1.28*fall;
        p.bodyRZ = .32*fall;
        p.bodyZ = .24*fall;
        p.chestRX = -.16*settle;
        p.headRX = -.35*fall;
        p.lShoulderX = -.85*fall;
        p.rShoulderX = -.25*fall;
        p.lElbowX = .35;
        p.rElbowX = .25;
        p.lHipX = .46*fall;
        p.rHipX = -.24*fall;
        p.lKneeX = .85*fall;
        p.rKneeX = .48*fall;
        return p;
      }

      getupPose(t) {
        const rise = smooth01(t);
        const p = mixPose(this.downPose(1), basePose(), rise);
        // Lift the torso first, then settle into the fighting stance.
        p.bodyY += Math.sin(rise * Math.PI) * .13;
        p.bodyRX += Math.sin(rise * Math.PI) * .10;
        p.chestRX -= Math.sin(rise * Math.PI) * .08;
        return p;
      }

      winPose(t) {
        const p = basePose();
        const rise = segment(t,0,.45);
        p.bodyY = .03*Math.sin(t*7);
        p.chestRX = -.08*rise;
        p.lShoulderX = -2.5*rise;
        p.rShoulderX = -2.5*rise;
        p.lShoulderZ = -.35*rise;
        p.rShoulderZ = .35*rise;
        p.lElbowX = .3;
        p.rElbowX = .3;
        p.headRX = -.12*rise;
        return p;
      }

      applyPose(pose, dt) {
        const smooth = 1 - Math.exp(-dt * 46);
        for (const k of POSE_KEYS) this.currentPose[k] = lerp(this.currentPose[k] || 0, pose[k] || 0, smooth);
        const p = this.currentPose;
        this.body.position.set(p.bodyX, p.bodyY, p.bodyZ);
        this.body.rotation.set(p.bodyRX, p.bodyRY, p.bodyRZ);
        this.chest.rotation.set(p.chestRX,p.chestRY,p.chestRZ);
        this.head.rotation.set(p.headRX,p.headRY,p.headRZ);
        for (const side of ['l','r']) {
          this.joints[side+'Shoulder'].rotation.set(p[side+'ShoulderX'],p[side+'ShoulderY'],p[side+'ShoulderZ']);
          // Positive X flexes the forearm toward local -Z, the fighter's front.
          this.joints[side+'Elbow'].rotation.set(p[side+'ElbowX'],0,p[side+'ElbowZ']);
          this.joints[side+'Hip'].rotation.set(p[side+'HipX'],p[side+'HipY'],p[side+'HipZ']);
          this.joints[side+'Knee'].rotation.x = p[side+'KneeX'];
          this.joints[side+'Ankle'].rotation.x = p[side+'AnkleX'];
        }
      }

      faceOpponent(opponent, dt) {
        if (this.state === 'down') return;
        const dx = opponent.root.position.x - this.root.position.x;
        const dz = opponent.root.position.z - this.root.position.z;
        const target = Math.atan2(-dx, -dz);
        let d = ((target - this.root.rotation.y + Math.PI) % TAU) - Math.PI;
        this.root.rotation.y += d * (1 - Math.exp(-dt * 12));
      }

      updateAI(dt, opponent) {
        this.aiThink -= dt;
        if (this.aiThink <= 0) {
          this.aiThink = .10 + Math.random()*.12;
          this.move.set(0,0,0);
          const dist = this.root.position.distanceTo(opponent.root.position);
          this.blocking = false;

          if (opponent.state === 'attack') {
            const a = ATTACKS[opponent.attackName];
            const n = opponent.stateTime / a.duration;
            if (n > .12 && n < .62 && Math.random() < .64) this.blocking = true;
            else if (Math.random() < .32) this.aiStrafe = Math.random() < .5 ? -1 : 1;
          }

          if (this.state === 'jump' && !this.airAttackUsed && Math.random() < .42) {
            this.requestAttack(Math.random() < .55 ? 'kick' : 'jab');
          } else if (this.state === 'attack' && this.attackName) {
            const n = this.stateTime/this.stateDuration;
            if (n > .42 && Math.random() < .30) {
              const options = COMBO_CHAINS[this.attackName] || [];
              if (options.length) this.requestAttack(options[Math.floor(Math.random()*options.length)]);
            }
          } else if (!this.blocking && ['idle','walk','block'].includes(this.state)) {
            if (dist > 3.3 && Math.random() < .24) this.startDash('forward');
            else if (dist > 2.15) this.move.z = 1;
            else if (dist < 1.10 && Math.random() < .22) this.startDash('back');
            else if (dist < 1.22) this.move.z = -.75;
            else {
              this.move.x = this.aiStrafe || (Math.random()<.5?-1:1);
              if (Math.random() < .035) this.startJump();
              else if (Math.random() < .50) {
                const r = Math.random();
                this.requestAttack(
                  r < .18 ? 'jab' :
                  r < .33 ? 'cross' :
                  r < .46 ? 'kick' :
                  r < .57 ? 'heavyKick' :
                  r < .69 ? 'uppercut' :
                  r < .81 ? 'backfist' :
                  r < .91 ? 'sweep' : 'flyingKnee'
                );
              }
            }
          }
        }
      }

      update(dt, opponent) {
        this.stateTime += dt;
        if (this.state === 'jump' || this.state === 'jumpAttack') this.jumpClock += dt;
        this.flashTime = Math.max(0, this.flashTime-dt);
        if (this.comboClock > 0) {
          this.comboClock = Math.max(0,this.comboClock-dt);
          if (this.comboClock === 0) {
            this.comboHits = 0;
            if (!this.isAI) hideCombo();
          }
        }

        if (this.isAI && this.canAct()) this.updateAI(dt, opponent);

        if (
          (this.state === 'jump' || this.state === 'jumpAttack') &&
          this.jumpClock >= this.jumpDuration
        ) {
          this.state = 'idle';
          this.stateTime = 0;
          this.attackName = null;
          this.root.position.y = FIGHTER_GROUND_Y;
          this.velocity.multiplyScalar(.45);
          const dustPos = this.root.position.clone(); dustPos.y = .10;
          sparks.spawn(dustPos,0xdce8ff,11,.66);
        } else if (this.state === 'jumpAttack' && this.stateTime >= this.stateDuration) {
          this.state = 'jump';
          this.stateTime = 0;
          this.attackName = null;
        } else if (
          this.state === 'attack' &&
          this.comboQueue &&
          this.stateTime/Math.max(this.stateDuration,.001) >= ATTACKS[this.attackName].cancel
        ) {
          const next = this.comboQueue;
          this.comboQueue = null;
          this.startAttack(next,true);
        } else if (this.state === 'attack' && this.stateTime >= this.stateDuration) {
          this.state = 'idle'; this.stateTime = 0; this.attackName = null; this.comboQueue = null;
        } else if (this.state === 'dash' && this.stateTime >= this.stateDuration) {
          this.state = 'idle'; this.stateTime = 0; this.dashKind = null;
          this.velocity.multiplyScalar(.28);
        } else if (this.state === 'hit' && this.stateTime >= this.stateDuration) {
          this.state = 'idle'; this.stateTime = 0;
        } else if (
          this.state === 'down' &&
          this.stateTime >= this.stateDuration &&
          this.health > 0 &&
          !roundOver
        ) {
          this.state = 'getup';
          this.stateTime = 0;
          this.stateDuration = .82;
          this.velocity.set(0,0,0);
        } else if (this.state === 'getup' && this.stateTime >= this.stateDuration) {
          this.state = 'idle';
          this.stateTime = 0;
          this.stateDuration = 0;
        }

        this.faceOpponent(opponent, dt);

        let desired = new THREE.Vector3();
        let localForward = 0;
        let localStrafe = 0;
        const toOpp = tmpV.copy(opponent.root.position).sub(this.root.position).setY(0).normalize();
        const side = tmpV2.set(-toOpp.z,0,toOpp.x);

        if (this.state === 'dash') {
          const n = clamp(this.stateTime/this.stateDuration,0,1);
          const curve = Math.pow(Math.max(.001,Math.sin(Math.PI*n)),.32);
          let dashDir = toOpp;
          let dashSpeed = 11.6;
          if (this.dashKind === 'back') { dashDir = toOpp.clone().negate(); dashSpeed = 11.2; }
          else if (this.dashKind === 'left') { dashDir = side.clone().negate(); dashSpeed = 13.4; }
          else if (this.dashKind === 'right') { dashDir = side.clone(); dashSpeed = 13.4; }
          this.velocity.copy(dashDir).multiplyScalar(dashSpeed*(.48+.52*curve));
          this.motionForward = this.dashKind === 'forward' ? 1 : this.dashKind === 'back' ? -1 : 0;
          this.motionStrafe = this.dashKind === 'right' ? 1 : this.dashKind === 'left' ? -1 : 0;
          this.speedRatio = 1;
          this.dashTrailTimer -= dt;
          if (this.dashTrailTimer <= 0) {
            this.dashTrailTimer = .025;
            const trailPos = this.root.position.clone();
            trailPos.y = .18;
            sparks.spawn(trailPos, this.dashKind === 'left' || this.dashKind === 'right' ? 0x79d9ff : 0xc9ddff, 3, .42);
          }
        } else if (this.state === 'jump' || this.state === 'jumpAttack') {
          const n = clamp(this.jumpClock/this.jumpDuration,0,1);
          const jumpHeight = 1.38;
          this.root.position.y = FIGHTER_GROUND_Y + 4*jumpHeight*n*(1-n);
          const airControl = .82 + .18*Math.sin(Math.PI*n);
          desired
            .addScaledVector(toOpp,this.jumpForward*4.15)
            .addScaledVector(side,this.jumpStrafe*3.65);
          this.velocity.x = lerp(this.velocity.x,desired.x,1-Math.exp(-dt*8*airControl));
          this.velocity.z = lerp(this.velocity.z,desired.z,1-Math.exp(-dt*8*airControl));
          this.motionForward = this.jumpForward;
          this.motionStrafe = this.jumpStrafe;
          this.speedRatio = clamp(desired.length()/4.15,0,1);
        } else if (this.canAct() && ['idle','walk','block'].includes(this.state)) {
          localForward = clamp(this.move.z,-1,1);
          localStrafe = clamp(this.move.x,-1,1);

          const forwardSpeed = localForward >= 0 ? 5.05 : 4.45;
          const strafeSpeed = 3.75;
          desired
            .addScaledVector(toOpp, localForward*forwardSpeed)
            .addScaledVector(side, localStrafe*strafeSpeed);

          const maxSpeed = this.blocking ? 1.55 : 5.10;
          if (desired.length() > maxSpeed) desired.setLength(maxSpeed);

          const hasInput = desired.lengthSq() > .0025;
          const response = hasInput ? 19 : 25;
          const targetX = this.blocking ? desired.x*.45 : desired.x;
          const targetZ = this.blocking ? desired.z*.45 : desired.z;
          this.velocity.x = lerp(this.velocity.x,targetX,1-Math.exp(-dt*response));
          this.velocity.z = lerp(this.velocity.z,targetZ,1-Math.exp(-dt*response));

          const actualForward = this.velocity.dot(toOpp);
          const actualStrafe = this.velocity.dot(side);
          this.motionForward = lerp(this.motionForward,clamp(actualForward/5.05,-1,1),1-Math.exp(-dt*12));
          this.motionStrafe = lerp(this.motionStrafe,clamp(actualStrafe/3.75,-1,1),1-Math.exp(-dt*12));
          this.speedRatio = lerp(this.speedRatio,clamp(this.velocity.length()/5.05,0,1),1-Math.exp(-dt*14));

          if (hasInput || this.speedRatio > .055) {
            if (!this.blocking) this.state = 'walk';
            this.walkPhase += dt * lerp(9.5,17.0,this.speedRatio);
          } else if (!this.blocking && (this.state === 'walk' || this.state === 'block')) {
            this.state = 'idle';
          }
          if (this.blocking) this.state = 'block';
        } else {
          this.velocity.x *= Math.exp(-dt*9);
          this.velocity.z *= Math.exp(-dt*9);
          this.motionForward = lerp(this.motionForward,0,1-Math.exp(-dt*10));
          this.motionStrafe = lerp(this.motionStrafe,0,1-Math.exp(-dt*10));
          this.speedRatio = lerp(this.speedRatio,0,1-Math.exp(-dt*10));
        }

        // Strikes carry the fighter's mass forward instead of animating in place.
        if (this.state === 'attack' && this.attackName) {
          const attack = ATTACKS[this.attackName];
          const n = clamp(this.stateTime/this.stateDuration,0,1);
          const travelCurve = smooth01(clamp((n-.05)/.52,0,1));
          const travelDelta = Math.max(0,travelCurve-this.attackTravel);
          if (travelDelta > 0) {
            const attackForward = new THREE.Vector3(0,0,-1).applyQuaternion(this.root.quaternion);
            this.root.position.addScaledVector(attackForward,attack.advance*travelDelta);
            this.attackTravel = travelCurve;
          }
        }

        this.root.position.addScaledVector(this.velocity, dt);
        const radial = Math.hypot(this.root.position.x, this.root.position.z);
        if (radial > 6.5) {
          this.root.position.x *= 6.5/radial;
          this.root.position.z *= 6.5/radial;
          this.velocity.multiplyScalar(.35);
        }

        // Resolve body overlap.
        const delta = tmpV.copy(this.root.position).sub(opponent.root.position).setY(0);
        const dist = delta.length();
        const minDist = this.radius + opponent.radius;
        if (dist > .001 && dist < minDist) {
          delta.multiplyScalar((minDist-dist)/dist*.5);
          this.root.position.add(delta);
          opponent.root.position.sub(delta);
        }

        let pose;
        if (this.state === 'attack' || this.state === 'jumpAttack') {
          const n = clamp(this.stateTime / this.stateDuration,0,1);
          const jumpN = clamp(this.jumpClock/this.jumpDuration,0,1);
          pose = this.state === 'attack'
            ? this.attackPose(this.attackName,n)
            : this.airAttackPose(this.attackName,n,jumpN);

          const a = ATTACKS[this.attackName];
          const limb = this.joints[a.limb];

          // Fast additive limb trails make rapid attacks readable.
          if (limb && n > .10 && n < .78) {
            this.trailTimer -= dt;
            if (this.trailTimer <= 0) {
              this.trailTimer = a.special ? .012 : .020;
              const trailPos = limb.getWorldPosition(new THREE.Vector3());
              sparks.spawn(trailPos,a.spark,a.special ? 4 : 2,a.special ? .48 : .28);
            }
          }

          if (!this.attackHit && limb && n >= a.active[0] && n <= a.active[1]) {
            const hitPos = limb.getWorldPosition(new THREE.Vector3());
            const targetPos = opponent.chest
              .getWorldPosition(new THREE.Vector3())
              .add(new THREE.Vector3(0,.25 + (a.targetY || 0),0));
            const actual = hitPos.distanceTo(targetPos);
            if (actual < a.range) {
              this.attackHit = true;
              opponent.takeHit({...a, limbPos:hitPos.clone()}, this);
            }
          }
        } else if (this.state === 'hit') pose = this.hitPose(clamp(this.stateTime/this.stateDuration,0,1));
        else if (this.state === 'down') pose = this.downPose(clamp(this.stateTime/Math.max(this.stateDuration,.01),0,1));
        else if (this.state === 'getup') pose = this.getupPose(clamp(this.stateTime/this.stateDuration,0,1));
        else if (this.state === 'dash') pose = this.dashPose(this.dashKind,clamp(this.stateTime/this.stateDuration,0,1));
        else if (this.state === 'jump') pose = this.jumpPose(clamp(this.jumpClock/this.jumpDuration,0,1));
        else if (this.state === 'win') pose = this.winPose(this.stateTime);
        else if (this.blocking) {
          this.state = 'block';
          pose = this.blockPose(this.stateTime);
        } else if (this.state === 'walk') {
          pose = this.runPose(this.motionForward,this.motionStrafe,this.speedRatio);
        } else pose = this.idlePose(performance.now()/1000 + (this.isAI?1.7:0));

        this.applyPose(pose, dt);

        const flash = this.flashTime > 0;
        for (const material of Object.values(this.materials)) {
          if ('emissiveIntensity' in material) {
            const specialGlow = this.state === 'attack' && this.attackName && ATTACKS[this.attackName]?.special
              ? .75 + .55*Math.sin(this.stateTime*85)
              : 0;
            material.emissiveIntensity = material === this.materials.accent
              ? (flash ? 2.5 : .15 + specialGlow)
              : (flash ? .65 : 0);
          }
        }
      }
    }

    class SparkSystem {
      constructor() {
        this.items = [];
        this.geo = new THREE.IcosahedronGeometry(.035,0);
      }
      spawn(position, color, count, force) {
        for (let i=0;i<count;i++) {
          const m = new THREE.Mesh(this.geo, new THREE.MeshBasicMaterial({color, transparent:true}));
          m.position.copy(position);
          m.scale.setScalar(.65+Math.random()*1.5);
          scene.add(m);
          const v = new THREE.Vector3(
            (Math.random()-.5)*force,
            (Math.random()*.8+.15)*force,
            (Math.random()-.5)*force
          );
          this.items.push({m,v,life:.26+Math.random()*.24,max:.5});
        }
      }
      update(dt) {
        for (let i=this.items.length-1;i>=0;i--) {
          const s = this.items[i];
          s.life -= dt;
          s.v.y -= 5.5*dt;
          s.m.position.addScaledVector(s.v,dt);
          s.m.rotation.x += dt*12;
          s.m.rotation.y += dt*9;
          s.m.material.opacity = clamp(s.life/s.max,0,1);
          s.m.scale.multiplyScalar(Math.exp(-dt*2.5));
          if (s.life<=0) {
            scene.remove(s.m);
            s.m.material.dispose();
            this.items.splice(i,1);
          }
        }
      }
    }
    const sparks = new SparkSystem();

    class ImpactFX {
      constructor() {
        this.rings = [];
        this.streaks = [];
        this.lights = [];
        this.ringGeo = new THREE.RingGeometry(.07,.12,32);
        this.streakGeo = new THREE.BoxGeometry(.018,.018,.65);
      }
      spawn(position,color,strength,direction,blocked=false) {
        sparks.spawn(position,color,Math.round((blocked?12:20)*strength),blocked?.8:1.15*strength);

        const ring = new THREE.Mesh(
          this.ringGeo,
          new THREE.MeshBasicMaterial({
            color, transparent:true, opacity:blocked?.65:.92,
            side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
          })
        );
        ring.position.copy(position);
        ring.scale.setScalar(blocked?.8:1);
        scene.add(ring);
        this.rings.push({mesh:ring,life:.25,max:.25,grow:blocked?4.0:6.5*strength});

        const streakCount = blocked ? 5 : Math.round(8+strength*5);
        for (let i=0;i<streakCount;i++) {
          const m = new THREE.Mesh(
            this.streakGeo,
            new THREE.MeshBasicMaterial({
              color,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending
            })
          );
          m.position.copy(position);
          const v = direction.clone().multiplyScalar(.8+Math.random()*1.4);
          v.x += (Math.random()-.5)*1.7;
          v.y += (Math.random()-.5)*1.4;
          v.z += (Math.random()-.5)*1.7;
          v.normalize();
          m.lookAt(position.clone().add(v));
          m.scale.z = .55+Math.random()*1.4;
          scene.add(m);
          this.streaks.push({mesh:m,vel:v.multiplyScalar((3.0+Math.random()*4.2)*strength),life:.16+Math.random()*.12,max:.28});
        }

        const light = new THREE.PointLight(color,blocked?7:18*strength,4.5,2);
        light.position.copy(position);
        scene.add(light);
        this.lights.push({light,life:.09,max:.09});
      }
      update(dt) {
        for (let i=this.rings.length-1;i>=0;i--) {
          const r=this.rings[i];
          r.life-=dt;
          r.mesh.quaternion.copy(camera.quaternion);
          r.mesh.scale.addScalar(r.grow*dt);
          r.mesh.material.opacity=clamp(r.life/r.max,0,1);
          if(r.life<=0){scene.remove(r.mesh);r.mesh.material.dispose();this.rings.splice(i,1);}
        }
        for (let i=this.streaks.length-1;i>=0;i--) {
          const s=this.streaks[i];
          s.life-=dt;
          s.mesh.position.addScaledVector(s.vel,dt);
          s.mesh.scale.z*=Math.exp(-dt*7);
          s.mesh.material.opacity=clamp(s.life/s.max,0,1);
          if(s.life<=0){scene.remove(s.mesh);s.mesh.material.dispose();this.streaks.splice(i,1);}
        }
        for (let i=this.lights.length-1;i>=0;i--) {
          const l=this.lights[i];
          l.life-=dt;
          l.light.intensity=18*clamp(l.life/l.max,0,1);
          if(l.life<=0){scene.remove(l.light);this.lights.splice(i,1);}
        }
      }
    }
    const impactFX = new ImpactFX();

    const player = new Fighter('VOLT', 0x1b7ee9, 0x37dbff, -1.55, false);
    const enemy = new Fighter('ONYX', 0x92223f, 0xff426a, 1.55, true);

    const cameraRig = { side:new THREE.Vector3(0,0,1), shake:0, fovKick:0 };

    let roundTime = 60;
    let roundOver = false;
    let introTime = 1.65;
    let lastMessageTimer = 0;

    function updateHealthUI() {
      ui.p1Health.style.width = `${player.health}%`;
      ui.p2Health.style.width = `${enemy.health}%`;
      ui.p1Damage.style.width = `${100-player.health}%`;
      ui.p2Damage.style.width = `${100-enemy.health}%`;
    }

    function showMessage(text, sub='', duration=1.1) {
      ui.messageText.textContent = text;
      ui.submessage.textContent = sub;
      ui.message.classList.add('show');
      lastMessageTimer = duration;
    }

    function screenFlash(amount) {
      ui.flash.style.opacity = amount;
    }

    function showCombo(count) {
      ui.comboCount.textContent = count;
      ui.combo.classList.remove('show');
      void ui.combo.offsetWidth;
      ui.combo.classList.add('show');
    }

    function hideCombo() {
      ui.combo.classList.remove('show');
    }

    function endRound(winner) {
      if (roundOver) return;
      roundOver = true;
      winner.state = 'win';
      winner.stateTime = 0;
      const loser = winner === player ? enemy : player;
      loser.state = 'down';
      loser.stateTime = 0;
      loser.stateDuration = 999;
      setTimeout(() => showMessage('K.O.', `${winner.name} WINS · ENTER TO RESTART`, 999), 320);
    }

    function restart() {
      roundOver = false;
      roundTime = 60;
      introTime = 1.3;
      for (const f of [player,enemy]) {
        f.health = f.displayHealth = 100;
        f.state = 'idle';
        f.stateTime = 0;
        f.stateDuration = 0;
        f.attackName = null;
        f.attackTravel = 0;
        f.comboQueue = null;
        f.comboHits = 0;
        f.comboClock = 0;
        f.dashKind = null;
        f.jumpForward = 0;
        f.jumpStrafe = 0;
        f.jumpClock = 0;
        f.airAttackUsed = false;
        f.trailTimer = 0;
        f.dashTrailTimer = 0;
        f.velocity.set(0,0,0);
        f.motionForward = 0;
        f.motionStrafe = 0;
        f.speedRatio = 0;
        f.blocking = false;
        f.root.position.set(f===player?-1.55:1.55,FIGHTER_GROUND_Y,0);
        f.currentPose = basePose();
      }
      hideCombo();
      updateHealthUI();
      showMessage('READY','',.72);
    }

    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      ensureAudio();

      const dashMap = {KeyW:'forward',KeyS:'back',KeyA:'left',KeyD:'right'};
      if (dashMap[e.code]) {
        const now = performance.now();
        if (lastTap[e.code] && now-lastTap[e.code] <= DASH_WINDOW_MS) {
          player.startDash(dashMap[e.code]);
          lastTap[e.code] = 0;
        } else lastTap[e.code] = now;
      }

      if (e.code === 'KeyE') player.startJump();
      if (e.code === 'KeyJ') player.requestAttack('jab');
      if (e.code === 'KeyK') player.requestAttack('cross');
      if (e.code === 'KeyL') player.requestAttack('kick');
      if (e.code === 'KeyI') player.requestAttack('heavyKick');
      if (e.code === 'KeyQ') player.requestAttack('uppercut');
      if (e.code === 'KeyR') player.requestAttack('backfist');
      if (e.code === 'KeyF') player.requestAttack('sweep');
      if (e.code === 'KeyG') player.requestAttack('flyingKnee');
      if (e.code === 'Enter') restart();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    });

    function updateInput() {
      player.move.set(
        (keys.KeyD?1:0) - (keys.KeyA?1:0),
        0,
        (keys.KeyW?1:0) - (keys.KeyS?1:0)
      );
      player.blocking = !!keys.Space && player.canAct() && ['idle','walk','block'].includes(player.state);
    }

    function updateCamera(dt) {
      const a = player.root.position;
      const b = enemy.root.position;
      const mid = tmpV.copy(a).add(b).multiplyScalar(.5);
      const axis = tmpV2.copy(b).sub(a).setY(0).normalize();
      let side = new THREE.Vector3(-axis.z,0,axis.x);
      if (side.dot(cameraRig.side) < 0) side.negate();
      cameraRig.side.lerp(side,1-Math.exp(-dt*2.2)).normalize();

      const dist = a.distanceTo(b);
      const desired = mid.clone()
        .addScaledVector(cameraRig.side, 7.3 + dist*.55)
        .add(new THREE.Vector3(0,3.5+dist*.16,0));

      if (cameraRig.shake > .001) {
        desired.x += (Math.random()-.5)*cameraRig.shake;
        desired.y += (Math.random()-.5)*cameraRig.shake;
        desired.z += (Math.random()-.5)*cameraRig.shake;
        cameraRig.shake *= Math.exp(-dt*14);
      }

      camera.position.lerp(desired,1-Math.exp(-dt*7.4));
      cameraRig.fovKick *= Math.exp(-dt*9.5);
      const targetFov = 44 + cameraRig.fovKick;
      camera.fov = lerp(camera.fov,targetFov,1-Math.exp(-dt*18));
      camera.updateProjectionMatrix();
      const target = mid.clone().add(new THREE.Vector3(0,1.22,0));
      const look = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(5).add(camera.position);
      look.lerp(target,1-Math.exp(-dt*8));
      camera.lookAt(look);
    }

    function updateRound(dt) {
      if (introTime > 0) {
        introTime -= dt;
        if (introTime <= .62 && introTime+dt > .62) showMessage('FIGHT','',.75);
        return;
      }
      if (!roundOver) {
        roundTime = Math.max(0, roundTime-dt);
        ui.timer.textContent = Math.ceil(roundTime).toString().padStart(2,'0');
        if (roundTime <= 0) endRound(player.health >= enemy.health ? player : enemy);
      }
      if (lastMessageTimer > 0) {
        lastMessageTimer -= dt;
        if (lastMessageTimer <= 0) ui.message.classList.remove('show');
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const rawDt = Math.min(clock.getDelta(), .033);
      let dt = rawDt;
      if (hitStop > 0) {
        hitStop = Math.max(0,hitStop-rawDt);
        dt = 0;
      }
      updateInput();
      updateRound(dt);
      player.update(dt, enemy);
      enemy.update(dt, player);
      sparks.update(rawDt);
      impactFX.update(rawDt);
      updateCamera(rawDt);

      ui.flash.style.opacity = Math.max(0, parseFloat(ui.flash.style.opacity || 0) - rawDt*1.9);
      renderer.render(scene,camera);
    }

    updateHealthUI();
    showMessage('READY','',.72);
    animate();
  })();
  </script>
</body>
</html>
