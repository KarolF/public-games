<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#26221d">
  <title>Wood Workshop Builder</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(31, 28, 24, 0.95);
      --panel-2: rgba(48, 42, 35, 0.97);
      --border: rgba(255,255,255,.15);
      --text: #f5f1ea;
      --muted: #c6bcae;
      --accent: #d59a55;
      --danger: #c85c4d;
      --ok: #70ad74;
      --button-h: 48px;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #26221d; color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }
    button, select {
      min-height: var(--button-h); border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel-2); color: var(--text); font: inherit; font-weight: 650;
      padding: 0 14px; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .42; }
    button.primary { background: var(--accent); color: #21170e; border-color: transparent; }
    button.danger { background: var(--danger); border-color: transparent; }
    button.active { outline: 2px solid var(--accent); outline-offset: -2px; }
    #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
    #viewport { position: relative; min-height: 0; overflow: hidden; }
    #game-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #topbar {
      z-index: 5; display: grid; grid-template-columns: minmax(100px,1fr) auto auto auto;
      gap: 8px; padding: max(8px, env(safe-area-inset-top)) 8px 8px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    #mode-select { width: 100%; }
    #status { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 3; pointer-events: none; display: flex; justify-content: center; }
    #status-text {
      max-width: min(92%,560px); padding: 8px 12px; border-radius: 999px;
      background: rgba(20,18,16,.84); border: 1px solid var(--border); font-size: 14px; text-align: center;
    }
    #selection {
      position: absolute; left: 10px; bottom: 10px; z-index: 3; padding: 8px 10px;
      border-radius: 10px; background: rgba(20,18,16,.84); border: 1px solid var(--border);
      font-size: 14px; color: var(--muted); pointer-events: none;
    }
    #bottom-panel {
      z-index: 5; display: grid; gap: 8px; padding: 8px 8px max(8px, env(safe-area-inset-bottom));
      background: var(--panel); border-top: 1px solid var(--border);
    }
    .tool-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
    .tool-row::-webkit-scrollbar { display: none; }
    .tool-row button { flex: 0 0 auto; }
    #move-grid { display: grid; grid-template-columns: repeat(6,minmax(46px,1fr)); gap: 6px; }
    #move-grid button { padding: 0 6px; }
    #result-card {
      position: absolute; z-index: 6; left: 50%; top: 50%; width: min(88%,380px);
      transform: translate(-50%,-50%); background: rgba(29,26,22,.98); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; box-shadow: 0 10px 34px rgba(0,0,0,.36);
    }
    #result-card[hidden], #craft-overlay[hidden] { display: none; }
    #result-card h2 { margin: 0 0 8px; font-size: 22px; }
    #result-card p { margin: 0 0 14px; color: var(--muted); line-height: 1.45; }
    #result-card button { width: 100%; }

    #craft-overlay {
      position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: auto auto 1fr auto auto;
      background: #211d18; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
      gap: 8px;
    }
    #craft-header { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
    #craft-title { font-size: 18px; font-weight: 750; }
    #craft-instruction { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.25; }
    #craft-hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .meter { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
    .meter strong { float: right; color: var(--accent); }
    .bar { height: 8px; margin-top: 6px; background: rgba(255,255,255,.1); border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0%; background: var(--accent); }
    #craft-stage { position: relative; min-height: 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: #c79a63; }
    #craft-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #craft-options, #craft-controls { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    #craft-options::-webkit-scrollbar, #craft-controls::-webkit-scrollbar { display: none; }
    #craft-options button, #craft-controls button { flex: 0 0 auto; }
    #power-btn.powering { background: var(--danger); color: white; }
    #craft-next { margin-left: auto; }

    @media (max-width: 430px) {
      :root { --button-h: 46px; }
      #topbar { gap: 6px; }
      #topbar button { font-size: 13px; padding: 0 8px; }
      #mode-select { font-size: 14px; padding: 0 8px; }
      #move-grid { grid-template-columns: repeat(3,1fr); }
      #selection { bottom: 8px; max-width: calc(100% - 20px); }
      #craft-overlay { gap: 6px; }
      #craft-hud { grid-template-columns: 1fr; }
      .meter { padding: 6px 9px; }
    }
    @media (orientation: landscape) and (max-height: 520px) {
      :root { --button-h: 42px; }
      #bottom-panel { grid-template-columns: 1fr 1.1fr; align-items: center; }
      #move-grid { grid-template-columns: repeat(6,1fr); }
      #status { top: 6px; }
      #craft-overlay { grid-template-columns: minmax(0,1fr) 210px; grid-template-rows: auto auto 1fr; }
      #craft-header, #craft-hud { grid-column: 1 / -1; }
      #craft-stage { grid-column: 1; grid-row: 3; }
      #craft-options { grid-column: 2; grid-row: 3; flex-direction: column; }
      #craft-controls { grid-column: 2; grid-row: 3; align-self: end; flex-direction: column; padding-top: 130px; }
      #craft-controls button { width: 100%; }
    }

<body>
  <main id="app">
    <header id="topbar">
      <select id="mode-select" aria-label="Furniture type">
        <option value="table">Build table</option>

      <button id="load-btn" type="button">Load</button>

    </header>

    <section id="viewport" aria-label="3D workshop">
      <canvas id="game-canvas"></canvas>
      <div id="status"><div id="status-text" aria-live="polite">Craft parts, assemble them, then test the build.</div></div>
      <div id="selection">Selected: none</div>
      <section id="result-card" hidden>
        <h2 id="result-title">Build result</h2>
        <p id="result-message"></p>
        <button id="result-close" type="button">Continue editing</button>
      </section>
    </section>

    <section id="bottom-panel" aria-label="Build controls">
      <div id="part-row" class="tool-row"></div>
      <div id="move-grid">
        <button data-action="move-x-neg" type="button">X−</button>
        <button data-action="move-x-pos" type="button">X+</button>
        <button data-action="move-z-neg" type="button">Z−</button>
        <button data-action="move-z-pos" type="button">Z+</button>
        <button data-action="move-y-neg" type="button">Y−</button>
        <button data-action="move-y-pos" type="button">Y+</button>
      </div>
      <div class="tool-row">
        <button data-action="rotate" type="button">Rotate 90°</button>
        <button id="router-btn" type="button">Use router</button>
        <button data-action="duplicate" type="button">Duplicate</button>
        <button data-action="delete" class="danger" type="button">Delete</button>
        <button data-action="undo" type="button">Undo</button>
        <button id="test-btn" class="primary" type="button">Test build</button>
      </div>
    </section>
  </main>

  <section id="craft-overlay" hidden aria-label="Carpenter minigame">
    <header id="craft-header">
      <button id="craft-cancel" type="button">Close</button>
      <div>
        <div id="craft-title">Workshop tool</div>
        <div id="craft-instruction">Follow the guide.</div>
      </div>
    </header>
    <div id="craft-hud">
      <div class="meter">Progress <strong id="craft-progress-text">0%</strong><div class="bar"><span id="craft-progress-bar"></span></div></div>
      <div class="meter">Estimated quality <strong id="craft-quality-text">100</strong><div class="bar"><span id="craft-quality-bar"></span></div></div>
    </div>
    <div id="craft-stage"><canvas id="craft-canvas"></canvas></div>
    <div id="craft-options"></div>
    <div id="craft-controls">
      <button id="tool-btn" type="button" hidden>Fine tool</button>
      <button id="rotate-work-btn" type="button" hidden>Turn workpiece</button>
      <button id="power-btn" class="primary" type="button" hidden aria-pressed="false">Start tool</button>
      <button id="craft-next" class="primary" type="button">Start</button>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const STORAGE_KEY = 'wood-workshop-mobile-v2';
    const GRID = 0.25;
    const MAX_PARTS = 20;
    const SHAPE_SAMPLES = 96;
    const PROFILE_SAMPLES = 28;

    const canvas = document.querySelector('#game-canvas');
    const viewport = document.querySelector('#viewport');
    const statusText = document.querySelector('#status-text');
    const selectionText = document.querySelector('#selection');
    const modeSelect = document.querySelector('#mode-select');
    const partRow = document.querySelector('#part-row');
    const testBtn = document.querySelector('#test-btn');
    const routerBtn = document.querySelector('#router-btn');
    const resultCard = document.querySelector('#result-card');
    const resultTitle = document.querySelector('#result-title');
    const resultMessage = document.querySelector('#result-message');

    const craftOverlay = document.querySelector('#craft-overlay');
    const craftCanvas = document.querySelector('#craft-canvas');
    const craftCtx = craftCanvas.getContext('2d');
    const craftTitle = document.querySelector('#craft-title');
    const craftInstruction = document.querySelector('#craft-instruction');
    const craftOptions = document.querySelector('#craft-options');
    const craftNext = document.querySelector('#craft-next');
    const toolBtn = document.querySelector('#tool-btn');
    const rotateWorkBtn = document.querySelector('#rotate-work-btn');
    const powerBtn = document.querySelector('#power-btn');
    const craftProgressText = document.querySelector('#craft-progress-text');
    const craftProgressBar = document.querySelector('#craft-progress-bar');
    const craftQualityText = document.querySelector('#craft-quality-text');
    const craftQualityBar = document.querySelector('#craft-quality-bar');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x837b6e);
    scene.fog = new THREE.Fog(0x837b6e, 12, 28);

    const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 60);
    camera.position.set(6.8, 5.5, 7.8);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 4;
    controls.maxDistance = 14;
    controls.minPolarAngle = 0.38;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.target.set(0, 1.15, 0);
    controls.touches.ONE = THREE.TOUCH.ROTATE;
    controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;

    scene.add(new THREE.HemisphereLight(0xfff4df, 0x4b453d, 2.2));
    const sun = new THREE.DirectionalLight(0xffead0, 3.2);
    sun.position.set(5, 9, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -7; sun.shadow.camera.right = 7; sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -7;
    scene.add(sun);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(18,18), new THREE.MeshStandardMaterial({ color: 0x5b554c, roughness: .95 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; floor.userData.decorative = true; scene.add(floor);
    const grid = new THREE.GridHelper(10,40,0xd1b486,0x786d5d);
    grid.position.y = .006; grid.material.opacity = .42; grid.material.transparent = true; grid.userData.decorative = true; scene.add(grid);
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x6a6257, roughness: 1 });
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(12,5,.25), wallMaterial);
    backWall.position.set(0,2.5,-5.5); backWall.receiveShadow = true; backWall.userData.decorative = true; scene.add(backWall);
    const sideWall = new THREE.Mesh(new THREE.BoxGeometry(.25,5,11), wallMaterial);
    sideWall.position.set(-6,2.5,0); sideWall.receiveShadow = true; sideWall.userData.decorative = true; scene.add(sideWall);
    const workshopWood = new THREE.MeshStandardMaterial({ color: 0x5a3420, roughness: .88 });
    function decorativeBox(size, position) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), workshopWood);
      mesh.position.set(...position); mesh.castShadow = true; mesh.receiveShadow = true; mesh.userData.decorative = true; scene.add(mesh);
    }
    decorativeBox([2.5,.18,.8],[-4.4,1.45,-3.8]);
    decorativeBox([.18,1.45,.18],[-5.35,.72,-4.05]); decorativeBox([.18,1.45,.18],[-3.45,.72,-4.05]);
    decorativeBox([.18,1.45,.18],[-5.35,.72,-3.55]); decorativeBox([.18,1.45,.18],[-3.45,.72,-3.55]);
    decorativeBox([2.3,.12,.45],[3.5,2.75,-5.1]); decorativeBox([2.3,.12,.45],[3.5,1.75,-5.1]);

    const PARTS = {
      table: [
        { type: 'tabletop', label: 'Cut tabletop', size: [3,.25,1.75], spawnY: 2 },
        { type: 'table-leg', label: 'Craft leg', size: [.32,1.85,.32], spawnY: .925 }
      ],
      chair: [
        { type: 'seat', label: 'Cut seat', size: [1.8,.25,1.65], spawnY: 1.5 },
        { type: 'chair-leg', label: 'Craft leg', size: [.28,1.35,.28], spawnY: .675 },
        { type: 'backrest', label: 'Add backrest', size: [1.8,1.4,.22], spawnY: 2.25 }
      ]
    };

    const woodMaterials = [0x9a5d32,0xaa6b3b,0x83502f,0xb47743].map(color => new THREE.MeshStandardMaterial({ color, roughness: .82, metalness: .02 }));
    const grooveMaterial = new THREE.LineBasicMaterial({ color: 0x3b2114, transparent: true, opacity: .9 });

    const state = {
      mode: 'table', parts: [], selectedId: null, nextId: 1, undo: [], testing: false,
      preTestSnapshot: null, minigame: null
    };
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const selectionBox = new THREE.BoxHelper(undefined, 0xffcf70);
    selectionBox.visible = false; selectionBox.userData.decorative = true; scene.add(selectionBox);

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function roundGrid(value) { return Math.round(value / GRID) * GRID; }
    function deepClone(value) { return JSON.parse(JSON.stringify(value)); }
    function friendlyType(type) { return type.split('-').map(word => word[0].toUpperCase() + word.slice(1)).join(' '); }

    function samplePolyline(points, count = SHAPE_SAMPLES, closed = true) {
      const segments = [];
      let total = 0;
      const limit = closed ? points.length : points.length - 1;
      for (let i = 0; i < limit; i++) {
        const a = points[i], b = points[(i + 1) % points.length];
        const length = Math.hypot(b.x - a.x, b.y - a.y);
        segments.push({ a, b, length, start: total }); total += length;
      }
      const output = [];
      for (let i = 0; i < count; i++) {
        const distance = total * (closed ? i / count : i / (count - 1));
        let seg = segments[segments.length - 1];
        for (const candidate of segments) if (distance <= candidate.start + candidate.length) { seg = candidate; break; }
        const t = seg.length ? (distance - seg.start) / seg.length : 0;
        output.push({ x: THREE.MathUtils.lerp(seg.a.x, seg.b.x, t), y: THREE.MathUtils.lerp(seg.a.y, seg.b.y, t) });
      }
      return output;
    }

    function normalizedShape(name, count = SHAPE_SAMPLES) {
      if (name === 'circle') return Array.from({ length: count }, (_,i) => { const a = i / count * Math.PI * 2; return { x: .5*Math.cos(a), y: .5*Math.sin(a) }; });
      if (name === 'oval') return Array.from({ length: count }, (_,i) => { const a = i / count * Math.PI * 2; return { x: .5*Math.cos(a), y: .42*Math.sin(a) }; });
      if (name === 'hexagon') return samplePolyline(Array.from({ length: 6 }, (_,i) => { const a = i / 6 * Math.PI * 2; return { x: .5*Math.cos(a), y: .5*Math.sin(a) }; }), count, true);
      if (name === 'organic') return Array.from({ length: count }, (_,i) => { const a = i / count * Math.PI * 2; const r = .46 + .035*Math.sin(3*a+.4) + .025*Math.sin(5*a); return { x: r*Math.cos(a), y: (.9*r)*Math.sin(a) }; });
      if (name === 'rounded') {
        const pts = [];
        const r = .16;
        const centers = [[.5-r,.5-r],[-.5+r,.5-r],[-.5+r,-.5+r],[.5-r,-.5+r]];
        const starts = [0,Math.PI/2,Math.PI,Math.PI*1.5];
        for (let c=0;c<4;c++) for (let j=0;j<count/4;j++) { const a=starts[c]+j/(count/4)*Math.PI/2; pts.push({x:centers[c][0]+r*Math.cos(a),y:centers[c][1]+r*Math.sin(a)}); }
        return pts;
      }
      return samplePolyline([{x:.5,y:.5},{x:-.5,y:.5},{x:-.5,y:-.5},{x:.5,y:-.5}], count, true);
    }

    function shapeWithOffsets(name, offsets = []) {
      const base = normalizedShape(name);
      return base.map((point,i) => {
        const prev = base[(i-1+base.length)%base.length], next = base[(i+1)%base.length];
        const tx = next.x - prev.x, ty = next.y - prev.y;
        const len = Math.hypot(tx,ty) || 1;
        const nx = ty/len, ny = -tx/len;
        const d = Number.isFinite(offsets[i]) ? THREE.MathUtils.clamp(offsets[i],-.07,.07) : 0;
        return { x: point.x + nx*d, y: point.y + ny*d };
      });
    }

    function createTopGeometry(size, craft = {}) {
      const shapeName = craft.shape || 'rectangle';
      const points = shapeWithOffsets(shapeName, craft.cutOffsets || []);
      const shape = new THREE.Shape();
      points.forEach((p,i) => {
        const x = p.x * size[0], y = p.y * size[2];
        if (i === 0) shape.moveTo(x,y); else shape.lineTo(x,y);
      });
      shape.closePath();
      const edgeType = craft.router?.type;
      const bevel = edgeType === 'rounded-edge' || edgeType === 'bevel';
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: size[1], steps: 1, curveSegments: 2,
        bevelEnabled: bevel,
        bevelSegments: edgeType === 'rounded-edge' ? 3 : 1,
        bevelSize: bevel ? Math.min(size[1]*.22,.055) : 0,
        bevelThickness: bevel ? Math.min(size[1]*.2,.05) : 0
      });
      geometry.rotateX(Math.PI/2);
      geometry.translate(0,size[1]/2,0);
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      return geometry;
    }

    function sanitizeLegSize(size) {
      const safe = Array.isArray(size) ? size.map(Number) : [];
      return [
        THREE.MathUtils.clamp(Number.isFinite(safe[0]) ? Math.abs(safe[0]) : .3, .12, 1.2),
        THREE.MathUtils.clamp(Number.isFinite(safe[1]) ? Math.abs(safe[1]) : 1.4, .35, 3.2),
        THREE.MathUtils.clamp(Number.isFinite(safe[2]) ? Math.abs(safe[2]) : .3, .12, 1.2)
      ];
    }

    function resampleProfile(profile, count = PROFILE_SAMPLES, fallback = .72) {
      const input = Array.isArray(profile) && profile.length
        ? profile.map(value => Number.isFinite(Number(value)) ? Number(value) : fallback)
        : [fallback, fallback];
      if (input.length === 1) input.push(input[0]);
      return Array.from({ length: count }, (_,index) => {
        const position = index / (count - 1) * (input.length - 1);
        const left = Math.floor(position), right = Math.min(input.length - 1, left + 1);
        return THREE.MathUtils.lerp(input[left], input[right], position - left);
      });
    }

    function sanitizeLegProfile(profile, fallback = .72) {
      let values = resampleProfile(profile, PROFILE_SAMPLES, fallback)
        .map(value => THREE.MathUtils.clamp(value, .3, 1));
      for (let pass = 0; pass < 3; pass++) {
        values = values.map((value,index,array) => {
          if (index === 0 || index === array.length - 1) return value;
          return array[index - 1] * .22 + value * .56 + array[index + 1] * .22;
        });
      }
      for (let index = 1; index < values.length; index++) {
        values[index] = THREE.MathUtils.clamp(values[index], values[index - 1] - .11, values[index - 1] + .11);
      }
      for (let index = values.length - 2; index >= 0; index--) {
        values[index] = THREE.MathUtils.clamp(values[index], values[index + 1] - .11, values[index + 1] + .11);
      }
      values[0] = Math.max(values[0], .42);
      values[values.length - 1] = Math.max(values[values.length - 1], .42);
      return values;
    }

    function geometryIsUsable(geometry, expectedHeight) {
      const position = geometry?.getAttribute?.('position');
      if (!position || position.count < 8) return false;
      for (let index = 0; index < position.array.length; index++) if (!Number.isFinite(position.array[index])) return false;
      geometry.computeBoundingBox(); geometry.computeBoundingSphere();
      const box = geometry.boundingBox;
      if (!box || !Number.isFinite(box.min.y) || !Number.isFinite(box.max.y)) return false;
      const height = box.max.y - box.min.y;
      return height > expectedHeight * .92 && height < expectedHeight * 1.08;
    }

    function createLatheLegGeometry(size, profile) {
      const safeSize = sanitizeLegSize(size);

    function workpieceLayout() {
      const w=craftCanvas.clientWidth,h=craftCanvas.clientHeight;
      return {w,h,cx:w/2,y0:34,y1:h-28,maxR:Math.min(w*.34,145)};
    }
    function carveAtPoint(mg,p) {
      const l=workpieceLayout(); if (p.y<l.y0 || p.y>l.y1) return;
      const t=clamp01((l.y1-p.y)/(l.y1-l.y0)), band=Math.round(t*(PROFILE_SAMPLES-1));
      const radius=clamp01(Math.abs(p.x-l.cx)/l.maxR); if (radius>=mg.current[mg.side][band]) return;
      const reach=mg.tool==='coarse'?2:1;
      for (let j=Math.max(0,band-reach);j<=Math.min(PROFILE_SAMPLES-1,band+reach);j++) {
        const blend=1-Math.abs(j-band)/(reach+1);
        const safeMinimum=Math.max(.3,mg.target[j]-(mg.tool==='coarse'?.085:.05));
        const requested=THREE.MathUtils.lerp(mg.current[mg.side][j],radius,blend*(mg.tool==='coarse'?.8:.55));
        const desired=Math.max(safeMinimum,requested);
        mg.current[mg.side][j]=Math.min(mg.current[mg.side][j],desired);

    }
    function latheAtPoint(mg,p) {

    function drawBoardBackground(ctx,w,h) {

    }));

    let pointerStart=null;
    canvas.addEventListener('pointerdown',event=>{ pointerStart={x:event.clientX,y:event.clientY,time:performance.now()}; });
    canvas.addEventListener('pointerup',event=>{
      if (!pointerStart || state.testing || state.minigame) return;
      const distance=Math.hypot(event.clientX-pointerStart.x,event.clientY-pointerStart.y), duration=performance.now()-pointerStart.time; pointerStart=null;
      if (distance>9 || duration>420) return;
      const rect=canvas.getBoundingClientRect(); pointer.x=((event.clientX-rect.left)/rect.width)*2-1; pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(state.parts,true).filter(hit=>state.parts.includes(hit.object) || state.parts.includes(hit.object.parent));
      const object=hits.length?(state.parts.includes(hits[0].object)?hits[0].object:hits[0].object.parent):null; setSelected(object?.userData.id || null);
    });
    canvas.addEventListener('contextmenu',event=>event.preventDefault());

    function resize() {
      const width=Math.max(1,viewport.clientWidth),height=Math.max(1,viewport.clientHeight); renderer.setSize(width,height,false); camera.aspect=width/height; camera.updateProjectionMatrix(); resizeCraftCanvas();
    }
    new ResizeObserver(resize).observe(viewport); window.addEventListener('orientationchange',()=>setTimeout(resize,120));

    let previousTime=performance.now();
    function animate(now) {
      const dt=Math.min((now-previousTime)/1000,.033); previousTime=now;
      if (state.testing && !resultTitle.textContent.includes('passed')) {
        for (const part of state.parts) {
          part.geometry.computeBoundingBox(); const floorY=-part.geometry.boundingBox.min.y;
          part.userData.velocity.y-=5.8*dt; part.position.addScaledVector(part.userData.velocity,dt);
          part.rotation.x+=part.userData.angularVelocity.x*dt; part.rotation.y+=part.userData.angularVelocity.y*dt; part.rotation.z+=part.userData.angularVelocity.z*dt;
          if (part.position.y<floorY) { part.position.y=floorY; part.userData.velocity.y*=-.22; part.userData.velocity.x*=.86; part.userData.velocity.z*=.86; part.userData.angularVelocity.multiplyScalar(.9); }
        }
      }
      controls.update(); updateSelectionBox(); renderer.render(scene,camera); drawMinigame(now); requestAnimationFrame(animate);
    }

    renderPartButtons(); resize(); updateControlState();
    const autosaved=localStorage.getItem(`${STORAGE_KEY}:autosave`);
    if (autosaved) try { hydrate(JSON.parse(autosaved)); setStatus('Previous session restored.'); } catch (error) { console.warn('Autosave restore failed:',error); }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
