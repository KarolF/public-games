<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storage Levels</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5b6573;
      --line: #d8dee8;
      --primary: #146c94;
      --primary-dark: #0f526f;
      --danger: #b42318;
      --ok: #137333;
      --warn: #9a6700;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 28px;
      line-height: 1.15;
    }

    h2 {
      font-size: 18px;
      line-height: 1.25;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 560px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      font: 14px/1.45 Consolas, "Courier New", monospace;
      color: var(--text);
      background: #fbfcfd;
    }

    textarea:focus,
    button:focus {
      outline: 3px solid rgba(20, 108, 148, 0.24);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 12px;
      font: 700 14px/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      color: var(--text);
      background: #eef2f7;
      border-color: var(--line);
    }

    button.secondary:hover {
      background: #e1e7ef;
    }

    button.danger {
      background: var(--danger);
    }

    button.danger:hover {
      background: #8f1d14;
    }

    .library-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .status[data-kind="ok"] {
      color: var(--ok);
    }

    .status[data-kind="warn"] {
      color: var(--warn);
    }

    .status[data-kind="error"] {
      color: var(--danger);
    }

    .level-list {
      display: grid;
      gap: 10px;
    }

    .level-row {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: #fbfcfd;
    }

    .level-row.active {
      border-color: var(--primary);
      box-shadow: inset 4px 0 0 var(--primary);
    }

    .level-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .level-name {
      min-width: 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .level-id {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .level-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      background: #fbfcfd;
    }

    @media (max-width: 860px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <h1>Storage Levels</h1>
      <div class="actions">
        <button id="previewActive" type="button">Preview Active</button>
        <button id="clearAll" class="danger" type="button">Clear All</button>
      </div>
    </div>

    <div class="workspace">
      <section class="panel" aria-labelledby="jsonLabel">
        <label id="jsonLabel" for="levelJson">Level JSON</label>
        <textarea id="levelJson" spellcheck="false" placeholder="Paste one editor-level v2 object or an array of objects."></textarea>
        <div class="actions">
          <button id="importJson" type="button">Import JSON</button>
          <button id="formatJson" class="secondary" type="button">Format</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="libraryTitle">
        <div class="library-head">
          <h2 id="libraryTitle">Saved Levels</h2>
          <span id="levelCount" class="count">0 levels</span>
        </div>
        <div id="levelList" class="level-list"></div>
      </section>
    </div>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "trainBrainUntangle.previewLevels.v1";
    const textarea = document.getElementById("levelJson");
    const status = document.getElementById("status");
    const levelList = document.getElementById("levelList");
    const levelCount = document.getElementById("levelCount");
    const importButton = document.getElementById("importJson");
    const formatButton = document.getElementById("formatJson");
    const previewActiveButton = document.getElementById("previewActive");
    const clearAllButton = document.getElementById("clearAll");

    function readLibrary() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { activeId: null, levels: [] };

      try {
        return normalizeLibrary(JSON.parse(raw));
      } catch (error) {
        setStatus(error.message || String(error), "error");
        return { activeId: null, levels: [] };
      }
    }

    function normalizeLibrary(raw) {
      const source = isObject(raw) ? raw : {};
      const levels = Array.isArray(source.levels)
        ? source.levels.map((entry, index) => normalizeStoredEntry(entry, index))
        : [];
      const activeId = cleanText(source.activeId) || (levels[0] ? levels[0].id : null);
      return { activeId, levels };
    }

    function normalizeStoredEntry(raw, index) {
      const source = isObject(raw) ? raw : {};
      const json = isObject(source.json) ? source.json : null;
      if (!json) throw new Error(`Saved level ${index + 1} has no json object.`);

      const id = cleanText(source.id) || cleanText(json.id) || defaultLevelId(index);
      const name = cleanText(source.name) || cleanText(json.name) || id;
      return { id, name, json };
    }

    function saveLibrary(library) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
    }

    function parseInput() {
      const text = textarea.value.trim();
      if (!text) throw new Error("Paste level JSON first.");
      return JSON.parse(text);
    }

    function importInput() {
      const parsed = parseInput();
      const entries = entriesFromInput(parsed);
      const library = readLibrary();

      for (const entry of entries) {
        const existingIndex = library.levels.findIndex((level) => level.id === entry.id);
        if (existingIndex >= 0) library.levels.splice(existingIndex, 1, entry);
        else library.levels.push(entry);
      }

      if (!library.activeId && entries[0]) library.activeId = entries[0].id;
      saveLibrary(library);
      render();
      setStatus(`Imported ${entries.length} level${entries.length === 1 ? "" : "s"}.`, "ok");
    }

    function entriesFromInput(input) {
      if (Array.isArray(input)) return input.map((item, index) => importedEntry(item, index));
      if (isObject(input) && Array.isArray(input.levels)) return input.levels.map((item, index) => importedEntry(item, index));
      return [importedEntry(input, 0)];
    }

    function importedEntry(raw, index) {
      const source = isObject(raw) ? raw : {};
      const json = isEditorLevel(source.json) ? source.json : source;
      validateEditorLevel(json, index);

      const id = cleanText(source.id) || cleanText(json.id) || defaultLevelId(index);
      const name = cleanText(source.name) || cleanText(json.name) || id;
      return { id, name, json };
    }

    function validateEditorLevel(level, index) {
      if (!isEditorLevel(level)) throw new Error(`Item ${index + 1} is not editor-level v2 JSON.`);
    }

    function isEditorLevel(value) {
      return isObject(value)
        && value.version === 2
        && Number.isFinite(Number(value.width))
        && Number(value.width) > 0
        && Number.isFinite(Number(value.height))
        && Number(value.height) > 0
        && Array.isArray(value.sequences);
    }

    function setActive(id) {
      const library = readLibrary();
      if (!library.levels.some((level) => level.id === id)) {
        setStatus(`Level '${id}' was not found.`, "error");
        return;
      }
      library.activeId = id;
      saveLibrary(library);
      render();
      setStatus(`Active level: ${id}`, "ok");
    }

    function deleteLevel(id) {
      const library = readLibrary();
      library.levels = library.levels.filter((level) => level.id !== id);
      if (library.activeId === id) library.activeId = library.levels[0] ? library.levels[0].id : null;
      saveLibrary(library);
      render();
      setStatus(`Deleted ${id}.`, "warn");
    }

    function clearAll() {
      if (!window.confirm("Clear all stored preview levels?")) return;
      localStorage.removeItem(STORAGE_KEY);
      render();
      setStatus("Cleared stored preview levels.", "warn");
    }

    function previewLevel(id) {
      const url = new URL("./", window.location.href);
      url.searchParams.set("mode", "storage");
      if (id) url.searchParams.set("id", id);
      window.location.href = url.toString();
    }

    function render() {
      const library = readLibrary();
      levelCount.textContent = `${library.levels.length} level${library.levels.length === 1 ? "" : "s"}`;
      previewActiveButton.disabled = library.levels.length === 0;
      levelList.replaceChildren();

      if (library.levels.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No saved levels.";
        levelList.append(empty);
        return;
      }

      for (const level of library.levels) {
        levelList.append(createLevelRow(level, library.activeId === level.id));
      }
    }

    function createLevelRow(level, active) {
      const row = document.createElement("article");
      row.className = active ? "level-row active" : "level-row";

      const title = document.createElement("div");
      title.className = "level-title";

      const name = document.createElement("div");
      name.className = "level-name";
      name.textContent = level.name;

      const badge = document.createElement("div");
      badge.className = "level-id";
      badge.textContent = active ? "active" : "";

      title.append(name, badge);

      const id = document.createElement("div");
      id.className = "level-id";
      id.textContent = level.id;

      const meta = document.createElement("div");
      meta.className = "level-meta";
      meta.textContent = `${level.json.width}x${level.json.height}, ${level.json.sequences.length} sequences`;

      const actions = document.createElement("div");
      actions.className = "row-actions";

      const activeButton = document.createElement("button");
      activeButton.className = "secondary";
      activeButton.type = "button";
      activeButton.textContent = "Set Active";
      activeButton.disabled = active;
      activeButton.addEventListener("click", () => setActive(level.id));

      const previewButton = document.createElement("button");
      previewButton.type = "button";
      previewButton.textContent = "Preview";
      previewButton.addEventListener("click", () => previewLevel(level.id));

      const deleteButton = document.createElement("button");
      deleteButton.className = "danger";
      deleteButton.type = "button";
      deleteButton.textContent = "Delete";
      deleteButton.addEventListener("click", () => deleteLevel(level.id));

      actions.append(activeButton, previewButton, deleteButton);
      row.append(title, id, meta, actions);
      return row;
    }

    function formatJson() {
      const parsed = parseInput();
      textarea.value = `${JSON.stringify(parsed, null, 2)}\n`;
      setStatus("Formatted JSON.", "ok");
    }

    function setStatus(message, kind) {
      status.textContent = message;
      status.dataset.kind = kind || "";
    }

    function cleanText(value) {
      return typeof value === "string" && value.trim() ? value.trim() : "";
    }

    function defaultLevelId(index) {
      return `level-${String(index + 1).padStart(3, "0")}`;
    }

    function isObject(value) {
      return Boolean(value) && typeof value === "object" && !Array.isArray(value);
    }

    importButton.addEventListener("click", () => {
      try {
        importInput();
      } catch (error) {
        setStatus(error.message || String(error), "error");
      }
    });

    formatButton.addEventListener("click", () => {
      try {
        formatJson();
      } catch (error) {
        setStatus(error.message || String(error), "error");
      }
    });

    previewActiveButton.addEventListener("click", () => previewLevel(null));
    clearAllButton.addEventListener("click", clearAll);

    render();
  </script>
</body>
</html>
