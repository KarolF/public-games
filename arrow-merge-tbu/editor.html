<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Arrow Merge Level Editor</title><link rel="stylesheet" href="style.css"/><style>html,body{overflow:auto;touch-action:auto;background:#0f1720;color:#f8f4e8}button,input,select,textarea{font:inherit}.editor-shell{min-height:100vh;padding:24px;box-sizing:border-box}.editor-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:0 auto 18px;max-width:1400px}.editor-header h1{margin:0 0 6px;font-size:28px}.editor-header p{margin:0;color:#b8c4d4}.editor-link{display:inline-block;padding:10px 14px;border:1px solid #40536a;border-radius:10px;color:#f8f4e8;text-decoration:none;background:#1b2735}.editor-main{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;max-width:1400px;margin:0 auto}.editor-panel{background:#162231;border:1px solid #314154;border-radius:16px;padding:16px;box-sizing:border-box}.editor-panel label{display:grid;gap:6px;margin:0 0 12px;color:#d8e2ef}.editor-panel input,.editor-panel select,.editor-panel textarea{box-sizing:border-box;width:100%;border:1px solid #40536a;border-radius:8px;background:#0d141d;color:#f8f4e8;padding:9px}.editor-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editor-row.buttons{margin:10px 0}.editor-panel button{border:1px solid #526a84;border-radius:10px;background:#25364a;color:#fff;padding:10px;cursor:pointer}.editor-panel button:hover,.editor-link:hover{background:#314762}.editor-panel hr{border:0;border-top:1px solid #314154;margin:14px 0}.editor-panel fieldset{border:1px solid #314154;border-radius:10px;margin:12px 0;padding:10px}.editor-panel legend{color:#f4c95d}.editor-panel .radio{display:flex;grid-template-columns:none;gap:8px;align-items:center;margin:6px 0}.editor-panel .radio input{width:auto}.file-label input{padding:7px}.editor-note{margin:8px 0 0;color:#b8c4d4;font-size:12px;line-height:1.35}.editor-status{min-height:20px;color:#80ed99}.editor-status.error{color:#ffadad}#json-output{height:260px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.45}.editor-canvas{background:#101820;border:1px solid #314154;border-radius:16px;padding:16px;overflow:auto}.editor-grid-wrap{min-width:min-content}.editor-grid{display:grid;gap:0;align-content:start;justify-content:start;user-select:none;touch-action:none}.editor-cell{box-sizing:border-box;width:56px;height:56px;min-width:32px;min-height:32px;border:1px solid #2d3b4d;border-radius:0;background:#172232;color:#f8f4e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);margin:0;touch-action:none}.editor-cell:hover{outline:2px solid #f4c95d;outline-offset:-2px}.editor-cell.selected-sequence-cell{outline:3px solid #fff;outline-offset:-3px}.editor-cell strong{font-size:15px;line-height:1}.editor-cell span{font-size:10px;opacity:.9}.editor-cell.head-cell,.editor-cell.body-cell,.editor-cell.tail-cell{border:0;box-shadow:none}.editor-cell.head-cell{background:color-mix(in srgb,var(--cell-color) 76%,#ffffff 8%);color:#06111c}.editor-cell.body-cell{background:color-mix(in srgb,var(--cell-color) 56%,#101820 44%)}.editor-cell.tail-cell{background:color-mix(in srgb,var(--cell-color) 45%,#101820 55%)}@media(max-width:900px){.editor-main{grid-template-columns:1fr}.editor-header{display:block}.editor-panel{order:2}}</style><style>.editor-tools{margin-top:0;padding:12px}.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.editor-panel .tool-option{display:block;margin:0;color:#f8f4e8}.tool-option input{position:absolute;opacity:0;pointer-events:none}.tool-option span{box-sizing:border-box;min-height:70px;border:1px solid #526a84;border-radius:8px;background:#223348;color:#f8f4e8;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:800;letter-spacing:0;line-height:1.1;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}.tool-option:hover span{background:#2f4661}.tool-option input:checked+span{background:#f4c95d;border-color:#ffe18a;color:#08131d;box-shadow:0 0 0 2px rgba(244,201,93,.18),inset 0 -2px 0 rgba(0,0,0,.18)}.tool-option input:focus-visible+span{outline:3px solid #80ed99;outline-offset:2px}.zoom-buttons button{min-height:54px;font-weight:800}.editor-bottom-controls{display:grid;gap:0}.editor-bottom-controls button+label{margin-top:12px}</style><script defer="defer" src="editor.bundle.min.js"></script></head><body><div id="level-editor-root"></div></body></html>
