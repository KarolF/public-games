<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Planner · Camera tracking</title>
    <script type="module" crossorigin src="../assets/doorTracking-DzqS08yv.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="../assets/tracking-CI-8csbO.js">
    <link rel="stylesheet" crossorigin href="../assets/doorTracking-CE37kr8K.css">
  </head>
  <body>
    <main>
      <header class="tracking-header">
        <a href="../">Back to Room Planner</a>
        <h1>3D door tracking</h1>
        <time id="build-stamp"></time>
      </header>
      <div id="stage" hidden>
        <canvas id="camera" aria-label="Live camera with a 3D doorway"></canvas>
        <span id="reticle" aria-hidden="true" hidden></span>
      </div>
      <div class="tracking-controls">
        <p id="status" role="status">Loading the tracking engine…</p>
        <div class="controls">
          <button id="start" type="button" disabled>Start camera</button>
          <button id="place" type="button" hidden>Place test door</button>
          <button id="measure" type="button" hidden>Measure doorway</button>
          <button id="mark" type="button" hidden>Mark</button>
          <button id="confirm" type="button" hidden>Confirm alignment</button>
          <button id="stop" type="button" hidden>Stop camera</button>
        </div>
        <p id="aim-feedback" hidden></p>
        <p id="error" role="alert" hidden></p>
        <button id="copy-camera-report" type="button" hidden>Copy camera report</button>
        <textarea id="camera-report" aria-label="Camera report" rows="5" readonly hidden></textarea>
        <div class="controls">
          <button id="method" type="button" hidden>Measure from two viewpoints</button>
          <button id="retake-left" type="button" hidden>Retake left jamb</button>
          <button id="retake-right" type="button" hidden>Retake right jamb</button>
          <button id="retake-top" type="button" hidden>Retake top edge</button>
          <button id="retake-view" type="button" hidden>Retake first view</button>
        </div>
        <section id="products" aria-label="Door preview" hidden>
          <p id="opening"></p>
          <div id="options" role="group" aria-label="Door products"></div>
          <p id="details"></p>
        </section>
      </div>
      <footer>
        8th Wall XR Engine by Niantic Spatial, Inc. Copyright © 2026 Niantic Spatial, Inc. All rights reserved.
        <a href="https://github.com/8thwall/engine/blob/main/LICENSE">License and warranty disclaimer</a>
      </footer>
    </main>
  </body>
</html>
